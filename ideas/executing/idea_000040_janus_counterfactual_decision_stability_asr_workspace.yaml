lane_promotion_gates:
- Every candidate paper lane needs one single-sentence thesis.
- Every lane needs a claim-to-evidence map with script/output paths and current gate
  status.
- Every lane needs at least one baseline that a reviewer would accept.
- Every lane needs a metric that is not just engineering progress.
- Every lane needs a sensitive-data boundary and a public/private artifact split.
- Future-paper lanes should be parked unless they either close a Paper 1 gate or have
  their own publishable evidence stack.
