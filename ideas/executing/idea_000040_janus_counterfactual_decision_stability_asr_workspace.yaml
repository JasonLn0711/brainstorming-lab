next_gate_sequence:
- Complete comparable 258-row baselines without changing the paper thesis.
- Keep split-aware metric inputs as the bridge from ASR quality to decision risk.
- Run or refresh the selected-300 high-stakes main experiment.
- Complete the selected-300 human risk-atom audit in batches, starting with critical_or_high_risk_missed
