capture_policy:
  canonical_execution_home: JANUS local research workspace
  brainstorming_role: Preserve the thesis, scope controls, risk analysis, and next
    decision gates without copying sensitive audio, call records, or transcript-bearing
    review sheets into this repo.
  planning_sync: not_requested
  planning_boundary: If planning is updated later, keep only title, idea ID, status,
    maturity score, next gate, canonical path, and capacity note.
  sensitive_data_boundary:
  - Treat audio, call data, transcript-bearing sheets, and call filenames as sensitive.
  - Keep local-only artifacts in the JANUS workspace ignored areas; do not copy them
    into brainstorming or planning.
  - Store only aggregate evidence, protocol names, script entrypoints, and non-sensitive
    repo map references here.
assumptions:
- The strongest short-term paper is not an ASR benchmark, but a decision-stability
  method for high-stakes conversational systems under ASR uncertainty.
- Whisper large-v2, Whisper small, Breeze-ASR-25 base, Breeze-ASR-26, legacy partial
  encoder, and legacy LoRA are useful as comparable ASR hypothesis generators.
- CER/WER remain useful input-quality metrics, but the primary paper claim depends
  on downstream stability signals such as label flips, unsafe downrouting, high-risk
  misses, CEIS, and recovery decisions.
- Human risk-atom review is a formal evidence layer separate from transcript ground-truth
  review; accepted manifest transcripts can remain WER/CER references.
- Evidence-chain readiness and publishability checks should stay machine-checkable
  so the paper does not advance claims before the selected-300 human audit and objective-level
  gates are complete.
- Recovery policy evidence is valuable, but it should support the CDS-ASR thesis rather
  than become a second uncontrolled research platform.
- Complexity growth is the main execution risk because audit, recovery, predictor,
  annotation, split-aware, proxy, and publishability layers can each expand into their
  own subsystem.
- A large internal exploration system can be valuable if it is periodically compressed
  into a research map with separable paper lanes, evidence status, and convergence
  gates.
- The repo can keep future-paper possibilities alive without exposing every subsystem
  in Paper 1; paper-facing scope should be selected from the research map only after
  the relevant lane has a clear thesis, metric, and evidence chain.
evidence:
- 'User-provided workspace framing on 2026-05-25: the single short-term paper axis
  is Counterfactual Decision-Stability ASR.'
- 'User-provided guardrail: the paper is not about fine-tuning Whisper, another ASR
  benchmark, small CER gains, or a human-review workflow.'
- 'User-provided runtime flow: audio -> ASR transcript plus confidence/n-best/timestamps
  -> risk atom extraction -> plausible counterfactual transcript alternatives -> downstream
  decision stability / CEIS -> automatic constrained recovery or conservative machine
  action.'
- Repo architecture already includes source archive organization, extracted part normalization,
  inventory, review flags, a purpose-oriented data library, Whisper and Breeze-ASR
  workspaces, experiment registry, semantic-risk-ASR subsystem, recovery policy subsystem,
  annotation subsystem, and evidence-chain subsystem.
- The JANUS dataset workspace already contains a canonical 258-row test split, a selected-300
  high-stakes audit surface, and a real-world call-center decision workflow where
  review burden and downstream accountability are part of the evidence target.
- 'Current aggregate 258-row split comparison includes six ASR hypothesis generators:
  legacy partial encoder, legacy LoRA, Breeze-ASR-25 base, Breeze-ASR-26, Whisper
  large-v2, and Whisper small.'
- Current evidence-chain gate reports ok=true but paper_ready=false because selected-300
  human risk-atom audit review remains 0/30 risk/decision row reviews and 0/90 model
  assessments reviewed.
- Current publishable evidence audit reports publishable_ready=false because objective
  5 is review_pending and objectives 4/6 remain proxy-only.
- Split-aware metric input generation and selected-300 metric-predictor proxy analysis
  compare WER/CER/SRES/CEIS against downstream label flips, unsafe downrouting, high-risk
  misses, and low-WER danger counts.
- The human risk-atom audit protocol is batchified, measurable, refreshable, and explicitly
  separate from transcript ground-truth scoring.
- The WER audit records that paper-facing ASR tables should use cer_zh_micro as the
  primary surface metric and wer_zh_jieba_micro only as supplemental segmented-word
  evidence.
baseline:
- Train Whisper, report WER/CER, compare ASR baselines, and frame the work as an ASR
  benchmark.
- Treat a single transcript as ground truth for downstream decisions without propagating
  plausible ASR alternatives.
- Run aggregate ASR metrics without split-aware high-stakes analysis.
- Treat recovery policy as the main result before proving the decision-instability
  measurement layer.
- Use ad hoc human review notes that cannot be audited, batched, validated, or refreshed.
- Let every subsystem grow independently until the reviewer cannot state the paper's
  contribution in one sentence.
metrics:
- Decision instability rate under plausible ASR counterfactual transcript alternatives.
- CEIS score distribution by split and model family.
- Label-flip rate between transcript alternatives and ASR hypothesis generators.
- Unsafe downrouting rate and high-risk miss rate on high-stakes subsets.
- Low-CER or low-WER danger count, where surface ASR quality looks acceptable but
  downstream decision risk changes.
- Semantic consequence distortion between ground-truth meaning and ASR-derived meaning
  for high-risk fields such as amount, transfer status, account disclosure, app installation,
  meeting arrangement, and escalation cues.
- Aggregate operational drift, measured as the gap between ground-truth aggregate
  risk quantities and ASR-derived aggregate risk quantities over a time window, split,
  model, or high-stakes subset.
- Social sensing measurement integrity, measured as whether ASR-derived aggregate
  signals preserve direction, rank, magnitude tier, and high-risk tails of ground-truth
  social-risk signals.
- Risk-weighted semantic atom error, where filler-word mistakes receive low weight
  and decision-controlling risk-atom mistakes receive high weight.
- Expected Operational Harm proxy, expressed as error probability multiplied by operational
  consequence for each risk-bearing field or action.
- 'Human risk-atom audit completion: 30/30 row-level risk/decision reviews and 90/90
  model-level assessments for the selected-300 gate.'
- 'Evidence-chain readiness status from machine-checkable gates: paper_ready and publishable_ready.'
- Recovery policy effectiveness after the selected-300 and human audit gates are complete.
- 'Scope-control health: every new subsystem must map to the one-sentence CDS-ASR
  thesis or remain parked.'
insights:
- The research shift is from transcription accuracy to uncertainty propagation into
  downstream decisions.
- Multiple ASR systems matter because CDS-ASR needs plausible transcript generators,
  not because the paper is a leaderboard.
- 'Evidence-chain governance is a publishability control: it keeps claims aligned
  with reviewed evidence, objective gates, and audit completeness.'
- The selected-300 human risk-atom audit is the main human evidence layer; transcript
  ground-truth review should not be reopened unless a new field requires it.
- 'Recovery policy belongs after instability measurement: it demonstrates conservative
  handling when decision confidence is unstable.'
- 'The reviewer-facing story must remain simple: high-stakes voice systems need to
  know whether decisions survive plausible ASR alternatives.'
- Complexity is a real research risk. Audit, recovery, predictor, annotation, and
  split-aware systems are supporting apparatus, not independent contribution centers.
- The issue is not complexity itself; the issue is complexity without knowledge compression.
  Subsystems should be periodically abstracted into higher-level research constructs
  such as uncertainty generation, uncertainty propagation, decision instability, recovery,
  auditability, governance, and metric validity.
- 'Research compression is the skill of turning the workspace from code, scripts,
  folders, and pipelines into a reviewer-comprehensible latent research structure:
  pain point, mechanism, evidence, thesis, and paper lane.'
- 'Semantic consequence quantification is the next layer above decision-stability
  scoring: it asks how far ASR-derived meaning, totals, risk fields, and operational
  actions drift from the ground-truth case meaning, not only whether the transcript
  contains token errors.'
- ASR can behave like a social sensing instrument. If it systematically undercounts
  or misreads risk-bearing fields, aggregate dashboards, escalation distributions,
  and resource allocation can drift even when per-sample WER looks acceptable.
- 'The social sensing instrument frame explains why aggregate drift matters: in a
  high-stakes hotline, ASR is part of the measurement chain that turns individual
  calls into social-risk signals, not only a transcript generator.'
