- Refresh validation, aggregate review status, human-reviewed predictor outputs, evidence-chain
  readiness, and objective-level publishability in one recorded pass.
- Evaluate recovery policies only after the selected-300 and human-audit gates make
  the instability evidence publishable.
real_world_pressure_test:
  setting: A high-stakes Mandarin or Taiwan Traditional Chinese call-center case where
    ASR alternatives differ in a few risk-bearing phrases, and the downstream system
    may either escalate the case, downroute it, or take conservative machine action.
  expected_failure_mode: Surface CER/WER appears acceptable, but a risk atom changes
    enough to flip the downstream decision or create unsafe downrouting.
  smallest_observable_test: For one selected batch, compare model hypotheses, risk
    atoms, counterfactual alternatives, CEIS, label flips, and reviewer assessment
    without exposing sensitive transcripts outside local-only artifacts.
  decision_metric: The idea is strengthened if CDS-ASR flags unstable cases that aggregate
    CER/WER would miss and the human audit confirms the risk-atom or decision concern.
complexity_containment:
  rule: 'Every new subsystem must answer one of three questions: does it generate
    plausible ASR alternatives, measure decision stability, or make the evidence chain
    publishable?'
  park_when:
  - The subsystem creates a new contribution that cannot be explained as support for
    CDS-ASR.
  - The subsystem requires a new evaluation layer before the selected-300 audit is
    complete.
  - The subsystem improves engineering elegance without changing claim-evidence alignment.
  allowed_growth:
  - scripts that close current evidence gates
  - aggregate tables needed by paper claims
  - reviewer-facing explanation of CDS-ASR, CEIS, and conservative action
  - local-only tools that reduce human audit burden without changing the sensitive-data
    boundary
research_program_strategy:
  exploration_mode:
    purpose: Let the local JANUS workspace grow as an internal research mine where
      multiple paper lanes can emerge from the same evidence infrastructure.
    allowed_behavior:
    - keep subsystem prototypes, proxy analyses, and local-only review tools inside
      the workspace while evidence is still immature
    - record what each subsystem tests, what evidence it has, and which higher-level
      construct it belongs to
    - postpone public paper framing for lanes that do not yet have a single-sentence
      claim and publishable evidence gate
    risk_control: Internal exploration must not become public-facing scope until it
      has been compressed into a paper lane with thesis, baseline, metric, evidence,
      and boundary.
  convergence_mode:
    purpose: Select one paper lane at a time and hide unrelated system complexity
      from the paper narrative.
    rule: Paper convergence starts by choosing one core question, one method object,
      one evidence stack, and one claim boundary.
    output: A paper lane packet with title candidate, single-sentence thesis, claim-to-evidence
      map, included subsystems, excluded subsystems, appendix candidates, and next
      validation gate.
  knowledge_compression_rule: 'Do not only add subsystems. Compress them upward into
    reusable research constructs: uncertainty generation, uncertainty propagation,
    decision instability, conservative recovery, audit scarcity, evidence governance,
    and metric validity.'
research_compression_method:
  definition: Turn a large exploratory system into a research core that is understandable,
    describable, testable, and publishable.
  north_star_question: How can high-stakes AI systems maintain auditable, safe, and
    stable decisions under uncertain inputs?
  latent_research_structure:
  - surface_item: WER/CER
    deep_structure: transcript uncertainty
    paper_role: input-quality evidence, not sufficient safety evidence
  - surface_item: downstream label flips
    deep_structure: decision instability
    paper_role: main result signal for CDS-ASR
  - surface_item: unsafe downrouting
    deep_structure: operational harm under uncertainty
    paper_role: high-stakes failure mode and safety metric
  - surface_item: recovery policy
    deep_structure: uncertainty-aware safety control
    paper_role: method extension or future paper lane
  - surface_item: evidence-chain audit
    deep_structure: reconstructability and accountability
    paper_role: claim-evidence governance and publication readiness
  theory_chain:
  - transcript uncertainty
  - semantic uncertainty
  - risk interpretation instability
  - operational decision instability
  - potential downstream harm
  - need for recovery and governance
  research_layers:
    engineering:
      description: Dataset loaders, configs, batch scripts, inventories, registries,
        local-only artifacts, and repo plumbing.
      paper_role: Usually methods appendix, reproducibility note, or invisible infrastructure.
    experimental_evidence:
      description: WER/CER, CEIS, label flips, high-risk misses, unsafe downrouting,
        low-WER danger counts, and human-reviewed assessments.
      paper_role: Results and evidence tables.
    research_mechanism:
      description: Counterfactual transcript alternatives, risk atoms, split-aware
        metric inputs, constrained recovery, and evidence-chain gates.
      paper_role: Methodology and evaluation design.
    theory_thesis:
      description: ASR accuracy alone is insufficient for high-stakes voice AI because
        transcript uncertainty can propagate into semantic uncertainty and operational
        decision instability.
      paper_role: Core contribution and introduction-level claim.
  compression_questions:
  - What pain point does this subsystem address if implementation details are removed?
  - Which higher-level uncertainty, decision, harm, recovery, or governance construct
    does it instantiate?
  - Is this subsystem Paper 1 core, Paper 1 support, a future paper lane, appendix
    material, or an internal tool?
  - What evidence would make this construct publishable instead of only interesting?
  - What baseline would a reviewer expect?
  - What claim boundary prevents over-selling the subsystem?
  publishable_core_test:
    understandable: A reviewer can state the problem in one sentence.
    describable: The method has named inputs, outputs, assumptions, and failure conditions.
    testable: The evidence has metrics, baselines, splits, and human-review status.
    submittable: The claim has public/private artifact boundaries and a publishability
      gate.
paper_cutting_method:
  rule: Cut papers by core question and evidence stack, not by directory, script,
    or subsystem count.
  portfolio_view:
    paper_1: CDS-ASR, focused on decision stability under transcript uncertainty.
    paper_2: Low-WER danger phenomenon, focused on metric validity and semantic-risk
      mismatch.
    paper_3: Recovery policies, focused on uncertainty-aware conservative routing.
    paper_4: Human review scarcity, focused on auditability under limited reviewers.
    paper_5: Evidence-chain governance, focused on machine-checkable AI evidence readiness.
  anti_pattern: A paper that lists many subsystems without compressing them into one
    latent research structure will read as engineering sprawl.
  positive_pattern: A paper that names one latent structure, shows observable phenomena,
    and maps each subsystem to a claim-evidence role becomes a research contribution.
research_narrative_strategy:
  rao_guidance_summary: A paper can be technically balanced but still fail to attract
    attention if it does not show why the reader should care. The narrative should
    begin with a real-world or anticipated problem, cite evidence that the problem
    matters, summarize existing approaches with citations, explain the remaining gap,
    then introduce a new framing and validation path.
  narrative_arc:
  - stage: real_world_problem
    purpose: Establish that high-stakes conversational AI is becoming operationally
      relevant and that ASR errors can affect downstream actions, not only transcripts.
    janus_version: High-risk AI systems may make dangerous operational decisions while
      surface ASR quality appears acceptable.
    citation_need:
    - adoption of voice or conversational AI in high-stakes settings
    - operational use cases such as healthcare, finance, customer service, government,
      fraud prevention, or call-center assistance
    - evidence that ASR errors or speech-interface errors can propagate into downstream
      task failure
  - stage: existing_methods
    purpose: Show what the field already uses to evaluate speech systems.
    janus_version: Current evaluation commonly emphasizes WER, CER, confidence, benchmark
      accuracy, and human review.
    citation_need:
    - standard ASR metrics and benchmark practice
    - confidence estimation or uncertainty estimation in ASR
    - human-in-the-loop review or speech system evaluation practice
  - stage: fundamental_gap
    purpose: Shift from method improvement to problem reframing.
    janus_version: Existing evaluation often measures transcript accuracy, but does
      not directly test whether plausible transcript alternatives change downstream
      decisions.
    citation_need:
    - evidence or prior arguments that WER/CER are incomplete proxies for semantic
      or task-level correctness
    - downstream speech understanding, semantic error, or task-oriented evaluation
      literature
    - safety or reliability literature on metric mismatch and operational risk
  - stage: new_framing
    purpose: Introduce CDS-ASR as a new problem framing, not only a new metric.
    janus_version: High-stakes conversational AI should evaluate decision stability
      under plausible ASR alternatives, not only transcript accuracy.
    citation_need:
    - related counterfactual evaluation or robustness literature
    - safety-critical AI evaluation and uncertainty propagation literature
    - governance or accountability literature where decision traces matter
  - stage: validation
    purpose: Connect methods and results to the real-world problem.
    janus_version: CEIS, label flips, unsafe downrouting, high-risk misses, human
      risk-atom audit, and recovery policy evidence test whether transcript uncertainty
      changes operational decisions.
    citation_need:
    - dataset or domain context citations where public
    - baseline ASR model citations
    - human audit, inter-rater, or expert review methodology references as needed
  narrative_thesis_options:
  - High-stakes voice systems need to know whether operational decisions remain stable
    under plausible ASR transcript alternatives.
  - ASR accuracy alone is insufficient for evaluating safety-critical conversational
    AI because small transcript uncertainty can propagate into downstream decision
    instability.
  - CDS-ASR reframes speech evaluation from transcript correctness to decision stability
    under plausible transcript alternatives.
  low_level_to_high_level_rewrites:
  - low_level: We build CEIS.
    high_level: Existing ASR metrics do not show whether transcript uncertainty changes
      downstream decisions, so CEIS measures operational decision stability.
  - low_level: We compare six ASR models.
    high_level: Multiple ASR systems provide plausible transcript hypotheses for testing
      whether downstream risk decisions survive ASR uncertainty.
  - low_level: We implement recovery policies.
    high_level: When decision stability fails, conservative recovery policies provide
      a bounded path from uncertainty detection to safer machine action.
  - low_level: We run a human audit.
    high_level: Human risk-atom review anchors decision-stability claims to accountable
      evidence rather than unverified proxy metrics.
  citation_policy:
    rule: Do not use dramatic or unsupported claims. Every real-world problem claim,
      existing-method summary, and gap claim needs citation support before manuscript
      use.
    positive_scope_language:
    - In high-stakes conversational systems, transcript uncertainty can propagate
      into downstream operational instability.
    - The study evaluates decision stability under plausible ASR alternatives.
    - Recovery and governance are treated as bounded scope controls, not proof of
      production readiness.
    avoid:
    - AI catastrophe claims
    - unsupported claims that all current ASR evaluation is wrong
    - implying production safety without a separate validation path
  consequence_driven_narrative:
    core_shift: Do not stop at metric mismatch. Move from metric problem, to false
      system belief, to unsafe deployment assumption, to operational failure mode,
      to human or organizational cost.
    why_metric_gap_is_not_enough: A new metric becomes meaningful only when the paper
      shows what decision the old metric would make people trust, why that trust is
      fragile, and which high-stakes action can change as a result.
    deployment_illusion: Organizations may treat low CER/WER, high confidence, or
      clean benchmark performance as evidence that a downstream voice-AI workflow
      is operationally reliable. CDS-ASR tests that belief directly by asking whether
      plausible transcripts preserve the downstream action.
    consequence_chain:
    - metric_problem: Surface ASR metrics look acceptable.
      wrong_system_belief: The voice-AI workflow appears reliable enough to automate
        or de-prioritize review.
      operational_failure: A high-risk case can be downrouted, missed, or assigned
        the wrong escalation state.
      cost_surface: Response can be delayed, review burden can shift to operators,
        and the organization can gain unearned confidence in automation.
    operational_translation:
    - technical_term: unsafe downrouting
      operational_language: High-risk cases are incorrectly lowered in handling priority.
    - technical_term: decision instability
      operational_language: Plausible transcripts for the same call lead to different
        machine actions.
    - technical_term: low-WER danger case
      operational_language: The transcript appears nearly correct, but the downstream
        decision is still unsafe or unstable.
    - technical_term: risk-atom miss
      operational_language: A small transcript difference removes or alters a key
        risk-bearing element that controls escalation.
    impact_ladder:
    - level: weak
      wording: WER does not reflect decision stability.
      reviewer_reaction: The reader may accept the statement but not feel why it matters.
    - level: medium
      wording: Low-WER transcripts can still cause downstream risk misclassification.
      reviewer_reaction: The reader sees task-level relevance, but the operational
        consequence is still abstract.
    - level: strong
      wording: Transcript-level correctness does not guarantee operational safety
        because a system can miss high-risk cases, lower priority incorrectly, or
        change escalation under plausible ASR alternatives.
      reviewer_reaction: The reader can connect metric mismatch to deployment risk.
    - level: vivid
      wording: A few ASR word differences can make a high-risk scam-support call look
        like low-risk general consultation and prevent timely escalation.
      reviewer_reaction: The reader can picture the failure mode, provided the paper
        supports it with de-identified or synthetic-safe evidence.
    manuscript_punchlines:
    - The dangerous case is not only visibly bad ASR; it is a system that appears
      normal while the downstream action has already changed.
    - Low transcript error rates can create a deployment illusion when operational
      decisions remain unstable.
    - CDS-ASR turns transcript uncertainty into an auditable test of whether the intended
      operational action survives plausible ASR alternatives.
    claim_boundary: Frame this as evidence-backed deployment-risk evaluation, not
      proof that all voice-AI deployments are unsafe and not proof of production readiness
      without a separate validation path.
  semantic_consequence_quantification:
    core_question: How much real-world meaning or operational quantity changes when
      decisions are computed from ASR-derived meaning instead of ground-truth case
      meaning?
    distinction_from_wer: WER counts transcript surface edits; semantic consequence
      quantification measures decision-relevant distortion, such as amount errors,
      transfer-status flips, risk-atom misses, priority changes, and aggregate drift.
    amount_example:
      ground_truth_meaning: A caller reports a high monetary loss.
      asr_derived_meaning: The ASR hypothesis changes the amount by one or more orders
        of magnitude.
      operational_effect: Severity, escalation urgency, case statistics, and resource
        allocation can shift even if the word-level transcript difference is small.
      boundary: Use only when amount fields can be extracted, normalized, and compared
        against accepted local references; otherwise treat amount distortion as an
        illustrative submetric, not the whole paper.
    measurement_families:
    - name: field_distortion
      definition: Compare ground-truth and ASR-derived values for structured risk
        fields, such as amount, transfer completion, credential disclosure, app installation,
        meeting plan, and callback channel.
      examples:
      - absolute amount error
      - relative amount error
      - risk-threshold crossing
      - boolean status flip
    - name: decision_consequence
      definition: Compare decisions derived from ground-truth meaning versus ASR-derived
        meaning.
      examples:
      - escalation flip
      - unsafe downrouting
      - high-risk miss
      - conservative-action trigger
    - name: aggregate_operational_drift
      definition: Sum or average ground-truth risk quantities and ASR-derived risk
        quantities over many cases, then measure the gap by model, split, time window,
        or high-stakes subset.
      examples:
      - total reported-loss drift
      - high-risk case count drift
      - escalation distribution drift
      - resource-allocation signal drift
    - name: risk_weighted_semantic_evaluation
      definition: Weight transcript or semantic errors by how much they control downstream
        risk and action.
      examples:
      - filler-word error has low weight
      - action-status flip has high weight
      - amount order-of-magnitude error has high weight
      - escalation cue deletion has high weight
    - name: expected_operational_harm_proxy
      definition: Estimate expected harm as error probability times operational consequence
        for risk-bearing fields, while keeping the result as a proxy until domain-validated.
      examples:
      - probability of amount error multiplied by severity-tier change
      - probability of transfer-status flip multiplied by escalation cost
      - probability of risk-atom miss multiplied by unsafe downrouting cost
    additional_blind_spots_to_track:
    - human transcript illusion, where fluent low-WER ASR makes reviewers overtrust
      a semantically distorted transcript
    - error asymmetry, where trivial filler mistakes and risk-controlling semantic
      flips should not receive equal evaluation weight
    - systematic bias, where a model repeatedly underestimates or overestimates risk-bearing
      quantities across many cases
    - calibration gap, where ASR confidence appears high even on fields that control
      downstream action
    - coverage gap, where only some cases contain extractable monetary or structured
      risk fields, requiring split-aware reporting rather than universal claims
    social_sensing_instrument_frame:
      definition: A social sensing instrument is a measurement pipeline that uses
        human-generated signals to infer the state of a social system, such as risk
        patterns, emerging events, fraud activity, public-health signals, or service
        demand.
      janus_interpretation: A high-stakes anti-scam hotline can act as a social-risk
        sensing surface because callers report transfer status, fraud scripts, monetary
        loss, contact channels, app downloads, account exposure, and escalation cues.
      asr_role: In this setting, ASR is not merely a transcription layer. It is part
        of the sensing chain that converts audio into measurable social-risk signals.
      measurement_integrity_risk: If ASR systematically distorts risk-bearing content,
        the resulting dashboard, aggregate statistics, escalation distribution, and
        resource-allocation signals can drift from the ground-truth case reality.
      examples:
      - search-query trends used as public-health signals
      - social-media event detection from rapid crowd reports
      - fraud monitoring from transaction-behavior anomalies
      - emergency or hotline calls as public-safety sensing surfaces
      paper_role: Use this as framing for why semantic consequence and aggregate drift
        matter; keep Paper 1 centered on CDS-ASR decision stability.
      citation_needs:
      - computational social sensing or social signal processing
      - crisis informatics and social-media event detection
      - measurement bias or data quality in computational social science
      - public-safety, emergency-call, or hotline analytics where public citations
        exist
      boundary: Do not claim JANUS measures all social fraud activity. Claim only
        that the ASR pipeline participates in a bounded social-risk measurement surface
        for the available high-stakes call data.
    claim_boundary: This layer should support CDS-ASR by quantifying consequence,
      not replace the core decision-stability thesis or become unconstrained metric
      engineering.
research_map:
  root_construct: uncertainty propagation into operational decisions
  branches:
    uncertainty_generation:
      includes:
      - ASR n-best hypotheses
      - confidence and timestamp alternatives
      - CER/WER and segmented Mandarin metrics
      - plausible transcript alternatives
      paper_lane: ASR uncertainty or conversational ASR robustness
      status: supporting Paper 1, possible future lane
    uncertainty_propagation:
      includes:
      - risk atom extraction
      - counterfactual transcript alternatives
      - transcript-to-decision pathways
      paper_lane: CDS-ASR core
      status: Paper 1 center
    decision_instability:
      includes:
      - CEIS
      - downstream label flips
      - unsafe downrouting
      - high-risk misses
      paper_lane: safety-critical conversational AI reliability
      status: Paper 1 center
    recovery_policies:
      includes:
      - automatic constrained recovery
      - conservative machine action
      - fallback decision rules
      paper_lane: uncertainty-aware runtime control or AI fallback systems
      status: future lane unless needed as Paper 1 supporting evidence
    auditability:
      includes:
      - selected-300 human risk-atom audit
      - batch review protocol
      - model-level reviewer assessment
      paper_lane: human-AI oversight under review scarcity
      status: evidence layer for Paper 1, possible future methods paper
    governance:
      includes:
      - evidence-chain readiness
      - objective-level publishability audit
      - claim-to-evidence gates
      paper_lane: AI governance or research evidence engineering
      status: internal quality system and possible future PaperOps-style lane
    metric_validity:
      includes:
      - low-WER danger cases
      - WER/CER versus downstream harm mismatch
      - SRES/CEIS predictor analysis
      - semantic consequence quantification
      - aggregate operational drift
      - risk-weighted semantic evaluation
      paper_lane: why WER is insufficient for high-stakes voice AI
      status: strong future-paper candidate after human-reviewed evidence is available
    social_sensing_measurement_integrity:
      includes:
      - hotline conversations as social-risk signals
      - ASR-derived aggregate risk statistics
      - measurement integrity under semantic distortion
      - social-risk dashboard drift
      - bounded public-safety sensing interpretation
      paper_lane: AI-mediated social-risk sensing and measurement integrity
      status: conceptual framing for Paper 1 and possible future paper lane after
        aggregate evidence exists
