  - split-aware WER/CER/SRES/CEIS tables
  - recovery policy proxy
  - human-review batching UI and scripts
  - publication readiness scripts
  reviewer_question: Given plausible ASR alternatives, can the proposed CDS-ASR evidence
    chain identify when a high-stakes downstream decision is stable, unstable, or
