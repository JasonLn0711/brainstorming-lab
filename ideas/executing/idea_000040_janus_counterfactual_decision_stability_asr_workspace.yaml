first_principle:
  scarce_resource: reviewer-comprehensible evidence for downstream decision stability
    under ASR uncertainty
  core_object: CDS-ASR as a method and evidence chain for testing high-stakes decision
    stability under plausible transcript alternatives
  not_the_core:
  - Whisper fine-tuning as the main contribution
  - another ASR benchmark
  - a small CER improvement paper
  - a generic human-review workflow paper
  - an unconstrained recovery-policy platform
  - an engineering universe without one thesis
  single_sentence_thesis: We propose a method to test whether high-stakes voice-system
    decisions remain stable under plausible ASR transcript alternatives.
  supporting_layers:
  - six-model ASR hypothesis ecosystem
  - risk-atom extraction
  - counterfactual transcript generation
  - CEIS and split-aware decision-stability metrics
  - human risk-atom audit
  - evidence-chain readiness and publishability gates
  - constrained recovery policy evaluation
  decision_boundary: A subsystem may grow only when it strengthens the single CDS-ASR
    thesis, closes a publishability gate, or reduces reviewer ambiguity.
paper_scope_control:
