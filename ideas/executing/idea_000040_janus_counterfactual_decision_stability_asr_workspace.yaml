    alternatives in high-stakes conversational decision systems.
  positive_positioning:
  - The work defines a decision-stability evaluation layer above ASR.
  - The work uses ASR models as hypothesis generators for downstream risk evaluation.
  - The work supports conservative machine action when transcript uncertainty affects
    decision stability.
  - The work provides machine-checkable evidence readiness for paper claims.
  support_not_center:
  - Whisper and Breeze-ASR baselines
