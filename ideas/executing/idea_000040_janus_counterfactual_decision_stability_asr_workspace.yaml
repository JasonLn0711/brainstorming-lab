status: executing
problem_statement:
  raw: 'Given JANUS high-stakes call-center ASR data, define the short-term paper
    as Counterfactual Decision-Stability ASR: test whether downstream risk decisions
    remain stable under plausible ASR transcript alternatives, rather than treating
    fine-tuning Whisper or improving CER/WER as the main contribution.'
  normalized: Given high-stakes conversational decision systems that depend on imperfect
    ASR hypotheses, optimize decision-stability evaluation under constraints of plausible
    transcript alternatives, risk-atom extraction, split-aware metrics, human audit
    capacity, sensitive local data handling, publishable evidence-chain readiness,
    and paper scope discipline.
  structure:
    given: high-stakes call-center conversations whose downstream risk decisions depend
      on ASR hypotheses
    optimize: decision-stability evaluation under plausible transcript alternatives
    constraints:
    - plausible ASR n-best, confidence, and timestamp alternatives
    - risk-atom extraction and human-reviewable labels
    - downstream label flips, unsafe downrouting, and high-risk misses
    - CEIS and split-aware metric inputs
    - constrained recovery or conservative machine action
    - selected-300 human risk-atom audit capacity
    - sensitive audio, call data, and filename boundaries
    - publishable evidence-chain readiness
    - one-paper thesis discipline
summary: 'JANUS CDS-ASR is a local research workspace and paper axis for testing whether
  high-stakes conversational decisions remain stable when ASR produces plausible alternative
  transcripts. Whisper, Breeze-ASR, and legacy ASR models are hypothesis generators,
  not the main contribution. The paper-facing contribution is uncertainty propagation
  into downstream decision stability: audio to ASR hypotheses, risk atoms, counterfactual
  transcript alternatives, CEIS and decision-stability scoring, then constrained recovery
  or conservative machine action. The central paper must stay anchored to one sentence:
  propose and evaluate a method for testing decision stability under ASR uncertainty
  in high-stakes conversational decision systems.'
source_note_zh: 這個 repo 的核心不是「整理資料夾」或「跑 ASR baseline」，而是把 JANUS 高風險通話資料正式收斂成 CDS-ASR：測試
  ASR 不確定性下，下游高風險決策是否穩定。Whisper fine-tuning、Breeze-ASR、六模型比較、recovery policy、human
  audit、evidence-chain gate 都是 supporting evidence；主角只能是 decision stability under
  plausible transcript alternatives。
