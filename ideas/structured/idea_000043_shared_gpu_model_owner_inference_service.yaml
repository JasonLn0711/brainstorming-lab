architecture_pattern:
  demo_antipattern:
  - UI loads ASR model
  - API worker loads ASR model
  - background worker loads ASR model
  - hot reload or multi-worker server loads extra copies
  local_5080_pattern:
  - Project A calls localhost API
  - Project B calls localhost API
  - Project C calls localhost API
  - Local AI Gateway exposes ASR, LLM, embedding, health, and model-status endpoints
  - resident model workers own RTX 5080 model loading and GPU queueing
  production_pattern:
  - UI, API, and job workers send request payloads only
  - ASR, LLM, embedding, and reranker services are separate model owners
  - queue, semaphore, batching, admission control, and timeouts live at the owner
    boundary
  - metrics expose VRAM, queue, latency, throughput, and rejected work
local_5080_profile:
  target_machine: RTX 5080 workstation as a local AI server
  workspace_shape:
  - ~/ai-local-services/asr_service/server.py
  - ~/ai-local-services/asr_service/model_loader.py
  - ~/ai-local-services/asr_service/queue.py
  - ~/ai-local-services/llm_service/server.py
  - ~/ai-local-services/llm_service/model_loader.py
  - ~/ai-local-services/clients/asr_client.py
  - ~/ai-local-services/clients/llm_client.py
  first_services:
  - local_asr_server.py
  - local_llm_server.py
  - local_embedding_server.py
  gateway_endpoints:
  - /asr/transcribe
  - /llm/chat
  - /embed
  - /health
  - /models/status
  project_contract:
  - Projects call the local client or HTTP API.
  - Projects do not directly call shared model loaders.
  - Projects do not call `.to("cuda")` for shared ASR, LLM, embedding, reranker, or
    TTS models.
  - Model service reports loaded model name, version, device, queue depth, and VRAM
    status.
  residency_policy:
  - Keep the most-used small model resident.
  - Load occasional large models on demand.
  - Use a queue or semaphore so heavy ASR and LLM jobs do not fight for one GPU.
  - Keep the API boundary stable so localhost can later become a remote GPU server.
  phased_roadmap:
  - 'Phase 1: ASR service with /health, /transcribe, startup model load, one-GPU-task
    semaphore, JSON transcript response, and shared asr_client.py.'
  - 'Phase 2: LLM service through an OpenAI-compatible local server such as vLLM,
    llama.cpp server, Ollama, or SGLang.'
  - 'Phase 3: embedding and reranker service with batching where useful.'
  - 'Phase 4: model manager for residency, lazy loading, unloading, and VRAM-aware
    policy after multiple resident services become painful.'
  model_manager_trigger:
  - More than two resident services regularly exceed comfortable VRAM headroom.
  - Large occasional models are useful but should not stay loaded.
  - Users need `/models/status` to show loaded, warming, unloading, queued, and failed
    states.
  - A single service crash or stale model state starts affecting multiple projects.
paper_narrative:
  teacher_rule: 'A paper can be technically balanced but still fail to attract readers.
    The first

    page should open with a cited real-world or credible near-future problem, then

    fairly summarize cited current solutions, identify the remaining gap with a clear

    reason, introduce the new viewpoint or architecture, and return to the opening

    problem with a claim-evidence-aligned contribution.

    '
  opening_problem:
    claim: 'Single-GPU AI workstations are becoming practical development environments

      for ASR, local LLM, embedding, RAG, medical demo, and research workflows, but

      project-level model loading turns each script into an independent GPU owner.

      This wastes scarce VRAM, repeats cold-start cost, and makes scheduling invisible.

      '
    evidence_needed:
    - PyTorch CUDA multiprocessing and shared-memory documentation.
    - Local AI workstation or small-lab GPU workflow examples from the user's projects.
    - Measured RTX 5080 baseline showing two project scripts load duplicate ASR or
      LLM model copies.
  current_solution_landscape:
    enablement: 'Existing inference-serving systems already show the right direction:
      serving

      engines own models, batch requests, expose APIs, and manage GPU utilization.

      vLLM addresses LLM KV-cache memory and scheduling; Triton supports dynamic

      batching and concurrent model execution; local LLM tools such as Ollama can

      expose local models through OpenAI-compatible APIs.

      '
    citation_targets:
    - PyTorch multiprocessing CUDA documentation.
    - vLLM / PagedAttention paper.
    - NVIDIA Triton dynamic batching documentation.
    - Ollama OpenAI compatibility documentation.
  remaining_gap:
    claim: 'These systems solve important serving problems, but they do not by themselves

      give a single-user research workstation a migration discipline for many small

      projects that currently import ASR, LLM, embedding, or reranker models directly.

      The missing object is a local model-owner boundary plus a staged migration rule:

      ASR service first, LLM service second, embedding/reranker third, and model manager

      only after residency pressure appears.

      '
  proposed_viewpoint:
    claim: 'Treat the RTX 5080 workstation as a local AI server. Projects send tasks;
      model

      services own GPU models. This reframes the problem from "how do I load a model

      inside each project?" to "which local service owns this model, how is work queued,

      and what evidence shows VRAM and latency improved?"

      '
  contribution_statement:
    draft: 'This work proposes a local model-owner architecture for single-GPU AI
      research

      workstations, starting with a resident ASR service and shared project clients,

      then extending to OpenAI-compatible local LLM serving and model residency policy.

      The contribution is a migration and measurement pattern that reduces duplicate

      model ownership while preserving project-level simplicity.

      '
  validation_path:
    first_experiment: 'Compare two active projects that directly load the same ASR
      model against two

      project clients calling one resident ASR service. Measure peak VRAM, warm-start

      latency, queue depth, p50/p95 latency, and failure behavior.

      '
    paper_boundary: 'The first claim should be workstation-level and evidence-backed.
      Do not claim

      a new general-purpose serving engine unless the benchmark extends beyond the

      local RTX 5080 ASR/LLM migration pattern.

      '
pressure_test:
  setting: One RTX 5080 workstation serving concurrent ASR, LLM, or embedding requests
    from several local projects through localhost.
  expected_failure_modes:
  - Developer thinks singleton solved the issue, but uvicorn or gunicorn workers still
    duplicate GPU owners.
  - Shared service saves model weight memory but p95 latency worsens because there
    is no batching or admission control.
  - Long LLM contexts consume KV cache and crowd out short requests.
  - Audio requests of different lengths cause head-of-line blocking.
  - MoE deployment saves active compute but still exceeds memory because expert weights
    are placed inefficiently.
  - A crashed model-owner service becomes a single point of failure without health
    checks and restart policy.
  - Too many resident model workers still exceed RTX 5080 VRAM, so the system needs
    a residency policy instead of keeping everything loaded.
  - Project clients bypass the gateway and quietly reintroduce direct `load_model()`
    calls.
  - The first design tries to build a full model manager before proving that one ASR
    service reduces duplicate VRAM use.
  smallest_observable_test: Run two deployment variants with the same model and the
    same synthetic request trace. Record process count, model-owner count, peak VRAM,
    p50/p95 latency, throughput, queue depth, timeout rate, and GPU utilization.
  confirming_metric: Shared model-owner serving reduces duplicate weight memory by
    at least one model copy while preserving or improving throughput under the target
    p95 latency budget.
  revision_metric: If VRAM savings appear but latency or reliability worsens, revise
    the design around batching, queue discipline, request classes, and timeout policy.
  kill_metric: If an off-the-shelf serving engine already meets memory, latency, fault
    isolation, and observability needs for the target workload, document the deployment
    recipe and stop treating this as a new research build.
