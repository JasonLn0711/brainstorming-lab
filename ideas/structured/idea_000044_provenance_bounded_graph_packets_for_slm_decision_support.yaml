id: idea_000044
title: Provenance-bounded graph packets for stable small-model decision support
created_at: '2026-06-01'
type: hypothesis
tags:
- knowledge-graph
- graph-compression
- small-language-models
- evidence-provenance
- decision-stability
- scientific-claim-verification
- trustworthy-rag
- graph-packets
- evidence-audit
status: execution_ready
problem_statement:
  raw: The broad label Knowledge Graph Compression + SLM is too generic and will be
    judged as ordinary GraphRAG, KGQA, graph summarization, or context compression.
    The stronger research object is a provenance-bounded compressed evidence graph
    packet that lets small language models reason inside an auditable evidence boundary.
  normalized: Given large evidence graphs and small language models with limited context
    budgets, construct compressed evidence graph packets that preserve source spans,
    support relations, evidence force, lineage depth, uncertainty, counterevidence,
    and decision boundaries under constraints of token budget, reviewer auditability,
    unsupported-claim risk, and crowded GraphRAG/KGQA baselines.
  structure:
    given: large evidence graphs and small language models with limited context budgets
    optimize: evidence-preserving graph packet construction for stable small-model
      decision support
    constraints:
    - token budget
    - unsupported-claim risk
    - provenance and citation-lineage loss
    - uncertainty and counterevidence loss during compression
    - reviewer pressure to distinguish from ordinary GraphRAG
    - need for auditable decision boundaries
summary: Expert review recommends narrowing the broad KG Compression + SLM direction
  into provenance-bounded evidence graph packets for stable small-model decision support.
  The first paper should focus on scientific-paper claim audit with SciFact-style
  records, compare raw text, top-k retrieval, generic summary, uncompressed graph
  neighborhoods, random/centrality pruning, and provenance-bounded graph packets,
  and evaluate unsupported-claim rate, provenance retention, citation lineage, answer
  correctness, uncertainty preservation, and decision stability. Direction A is the
  first paper; Direction C is the downstream evaluation layer; Direction B and Direction
  D remain later roadmap items.
source_note_zh: 專家建議不要把這條線命名為一般的 Knowledge Graph Compression + SLM，而要收斂成 provenance-bounded
  evidence graph packets for stable small-model decision support。第一篇只做 A + C 的最小版本：provenance-preserving
  compression、SLM answer discipline、decision stability。B 的 pheromone/dynamic compression
  與 D 的 ancient-script symbolic KG compression 先放 roadmap。
assumptions:
- A generic KG Compression + SLM title will be reviewed against GraphRAG, KGQA, graph
  summarization, and context compression baselines.
- The differentiated scientific object is not the graph itself, but the compressed
  evidence graph packet that preserves evidence boundaries for a small model.
- Citation presence is not the same as evidence support; packet fields must preserve
  evidence force and lineage.
- Small-model decision support should be evaluated by evidence discipline and stability,
  not only answer accuracy.
- Scientific-paper claim audit is a cleaner first domain than cybercrime/scam evidence
  or ancient-script symbolic hypothesis ranking.
- Direction B is better treated as adaptive retrieval, graph signal processing, or
  agent memory for a later paper.
- Direction D is distinctive but requires domain expertise and should be a later testbed.
evidence:
- Expert response recorded in expert-review-packets/2026-06-01-kg-compression-slm/07_expert_review_response.md.
- Expert decision record summarized in expert-review-packets/2026-06-01-kg-compression-slm/08_decision_record.md.
- Expert methodology response recorded in expert-review-packets/2026-06-01-kg-compression-slm/09_data_benchmark_experiment_review.md.
- Executable experiment design summarized in expert-review-packets/2026-06-01-kg-compression-slm/10_experiment_design_record.md.
- Second narrowing review recorded in expert-review-packets/2026-06-01-kg-compression-slm/11_expert_second_narrowing_review.md.
- Final narrowed pilot plan summarized in expert-review-packets/2026-06-01-kg-compression-slm/12_narrowed_pilot_plan.md.
- Existing packet sources map this line to externalized cognition, evidence provenance,
  hidden-state thinking, transformer succinctness, pheromone/Physarum routing, journal
  intelligence, and JANUS research compression.
baseline:
- raw text context plus SLM
- generic summary plus SLM
- top-k retrieved text plus SLM
- uncompressed graph neighborhood plus SLM
- random graph pruning plus SLM
- centrality-based graph pruning plus SLM
- gold human or dataset label reference
- larger LLM reference model as ceiling, not gold truth
metrics:
- unsupported-claim rate
- provenance retention
- citation lineage preservation
- answer or decision correctness
- uncertainty preservation
- decision stability or label flip rate
- context token budget
- compression ratio
- human audit time
- counterevidence retention
- abstention correctness
insights:
- The first contribution should be framed as evidence-preserving graph packet construction,
  not generic KG compression.
- The packet is a bounded reasoning substrate for SLMs, not merely a retrieved subgraph
  or summary.
- Compression must preserve source_span, support_relation, evidence_force, lineage_depth,
  uncertainty, and counterevidence_flag.
- The first paper should demonstrate that evidence-boundary preservation matters under
  a fixed or lower token budget.
- The strongest defense against the GraphRAG-plus-JSON critique is a compression objective,
  ablation, and metrics for provenance, uncertainty, and counterevidence preservation.
- The near-term action is to start a pilot now, but only with A + C minimal version.
- 'The first paper must narrow again: prove measurable evidence-discipline gains under
  a fixed token budget, not a broad GraphRAG, meeting-decision, dynamic-memory, or
  latent-state system.'
- The hardest reviewer risk is the claim that the method is GraphRAG plus JSON formatting
  plus citation prompting; the defense must include flat evidence list, context compression,
  serialization perturbation, relation-hidden packet, and predicted-track results.
