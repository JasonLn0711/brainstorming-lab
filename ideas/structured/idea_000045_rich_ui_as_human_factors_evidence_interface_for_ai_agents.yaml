rich_ui_component_hypotheses:
- component: symptom_timeline
  decision_value: Helps staff see onset, progression, and missing time anchors.
  risk_control: Keeps patient-entered evidence separate from inferred chronology.
- component: vital_sign_trend
  decision_value: Makes numeric change and threshold crossing easier to inspect than
    prose.
  risk_control: Requires source labels and measurement-time visibility.
- component: risk_factor_cards
  decision_value: Groups risk signals into inspectable factors instead of burying
    them in a paragraph.
  risk_control: Shows missing or patient-denied factors explicitly when clinically
    relevant.
- component: question_flow_graph
  decision_value: Shows why the agent asked the next question and where uncertainty
    remains.
  risk_control: Prevents the flow from looking like a diagnosis path by labeling it
    as intake support.
- component: staff_review_summary_card
  decision_value: Gives clinicians a compact next-action surface.
  risk_control: Includes uncertainty, source evidence, and review action rather than
    final autonomous judgment.
- component: evidence_trace_panel
  decision_value: Lets reviewers inspect source answer, transcript, model interpretation,
    and confirmation state.
  risk_control: Supports audit without exposing sensitive raw data beyond the approved
    review context.
pressure_tests:
- name: Medical intake review speed test
  setting: A staff reviewer compares two synthetic patient intake cases, one rendered
    as plain text or JSON and one rendered as Rich UI.
  expected_failure_mode: The rich version looks polished but staff still miss an incorrect
    symptom, missing vital sign, or unsafe next action.
  smallest_observable_test: Create 6 synthetic cases with seeded errors and measure
    time-to-first-safe-action plus seeded-error detection across plain and rich formats.
  metric_or_decision: Continue only if Rich UI improves review speed or error detection
    without increasing miscalibrated trust.
- name: ASR disagreement trace test
  setting: A noisy short-answer intake flow has a transcript hypothesis, a direct-audio
    semantic hypothesis, and a disagreement gate.
  expected_failure_mode: The UI hides the disagreement and users trust the polished
    summary instead of confirming the symptom.
  smallest_observable_test: Build a trace panel for 10 synthetic ASR-drift examples
    and ask reviewers to identify the correct confirmation action.
  metric_or_decision: Keep the pattern only if reviewers can locate transcript, interpretation,
    uncertainty reason, and next confirmation action within a preset time.
- name: Patient completion burden test
  setting: A patient-facing previsit form asks adaptive symptom questions on mobile.
  expected_failure_mode: Rich components create more scrolling, distraction, or anxiety
    than a direct question flow.
  smallest_observable_test: Compare a simple text form with a rich adaptive form on
    5 synthetic tasks and collect completion time, drop-off point, and cognitive-load
    rating.
  metric_or_decision: Use Rich UI only for components that improve completion or clarity
    without increasing anxiety or abandonment.
