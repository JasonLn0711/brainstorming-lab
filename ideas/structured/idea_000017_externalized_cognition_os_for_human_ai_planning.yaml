planning_boundary:
  sync_rule: Keep the detailed cognition-OS reasoning in brainstorming-lab. Planning
    should receive only a short bridge if this changes repo architecture, weekly review,
    or daily planning behavior.
  planning_summary_shape:
  - title
  - id
  - status
  - maturity_score
  - next_test
  - canonical_path
  - capacity_note
concept_frame:
  core_claim: 'Personal planning becomes more powerful when treated as a distributed
    cognition system: human values set direction, external memory preserves state,
    and AI recombines context across bounded repositories.'
  human_limits:
  - Working memory cannot reliably hold large dependency graphs.
  - Long inference chains decay unless written down.
  - Emotional priority and identity are not naturally represented by file structure
    alone.
  external_memory_layers:
  - daily notes
  - weekly plans
  - canonical idea YAML
  - Markdown reasoning notes
  - project repos
  - paper labs
  - Git history
  - search and indexes
  - AI-readable summaries
  ai_strengths:
  - large-context synthesis
  - cross-file linking
  - state summarization
  - dependency reconstruction
  - candidate next-step generation
  - routine implementation through tools
  - drafting and verification loops
  human_responsibilities:
  - decide what matters
  - set capacity and priority
  - resolve value conflicts
  - choose which future is worth building
  - kill or park ideas honestly
  - authorize decisions whose consequences the human must live with
  - notice embodied signals such as exhaustion, fear, desire, grief, and meaning
  division_of_labor:
    human_should_not_be_forced_to:
    - remember everything
    - manually reconstruct context chains
    - format every artifact
    - compare every option from scratch
    - act like a database
    ai_should_not_be_forced_to:
    - pretend to have the user's lived history
    - decide the user's identity
    - erase moral responsibility through optimization language
    - choose life direction without human authorization
    collaboration_rule: Let AI carry context-heavy extension work so the human can
      spend scarce attention on value, meaning, responsibility, and embodied priority.
  digital_cognitive_twin:
    claim: A deeply externalized life system can let AI build a high-resolution descriptive
      model of the person.
    inputs:
    - daily notes
    - brainstorming records
    - repo history
    - decision logs
    - emotional reflections
    - research goals
    - communication style
    - relationship patterns when explicitly provided
    possible_outputs:
    - preference map
    - decision tendency model
    - emotional association map
    - life trajectory hypotheses
    - recurring conflict patterns
    - future preference simulation
    boundary: This can produce descriptive understanding, but it does not give AI
      first-person existence or make AI become the user.
agent_era_reflection:
  question: If AI agents can increasingly perform reasoning, planning, and implementation,
    what remains distinctly human?
  answer: The human layer is not raw reasoning speed. It is lived consequence, value
    selection, meaning-making, responsibility, and identity formation.
  risk: If the system treats every life decision as an optimization problem, it may
    hide the human cost and moral ownership behind agent-generated plans.
  design_implication: Planning tools should label which decisions are AI-executable,
    which are AI-advisable but human-authorized, and which require human-only value
    reflection before any execution.
understanding_distinction:
  descriptive_understanding: AI can model the user's patterns, values, fears, preferences,
    decisions, and emotional associations from enough externalized context.
  functional_understanding_view: If AI predicts, responds, and helps well enough,
    some theories would treat that as a real form of understanding.
  existential_understanding_view: Other theories require subjective experience, embodiment,
    and first-person feeling; under that view, AI can describe pain without being
    the one in pain.
  fire_analogy: AI can know the chemistry, temperature, and injury model of fire,
    but that differs from being burned.
  practical_rule: Use AI's descriptive model as a mirror and advisor, but do not outsource
    the final meaning of lived experience to the model.
inner_archive_architecture:
  captured_at: 2026-06-11
  core_claim: A private `inner-archive` repo should preserve the inner layer of life
    as a Life Knowledge Repo, not only a diary. It should handle short mood notes,
    long reflections, partial thoughts, complete diary entries, event reactions, relationship
    meaning, recurring themes, and later self-understanding.
  first_principle:
    scarce_resource:
    - expressive fidelity
    - privacy
    - future retrievability
    - emotional continuity
    - low-friction capture
    canonical_home:
      planning: locator, architecture decision, capacity impact, and next gate
      inner_archive: raw personal notes, long reflections, private emotional writing,
        event/people detail, attachments, and maps
      brainstorming_lab: broader theory of externalized cognition and human-AI self-modeling
  repo_skeleton:
  - inbox
  - journal
  - thoughts
  - essays
  - people
  - events
  - themes
  - maps
  - templates
  - _attachments
  connection_rules:
  - Link notes that share a concrete life theme.
  - Link event notes to reflection notes when one records what happened and the other
    records what it meant.
  - Promote a theme page when a thought recurs three or more times.
  - Link later notes to earlier notes when they reinterpret the earlier note.
  - Link notes that change future action, capacity, project direction, or a relationship
    decision.
  - Link useful contrasts when two notes disagree and reveal growth or tension.
  ai_agent_role:
    useful_for:
    - converting raw voice or text into Markdown without overwriting the raw text
    - suggesting titles, types, tags, links, and candidate folders
    - creating weekly reflections and monthly theme maps
    - detecting repeated motifs
    - separating observed evidence, interpretation, and speculation
    boundaries:
    - never overwrite raw emotional text
    - do not sanitize the lived voice into generic self-help prose
    - do not decide the final meaning of an experience
    - do not expose private notes to public channels
    - do not create publishable excerpts without explicit approval
  raw_preservation_rule: raw 永遠不可覆蓋；AI 可以整理，但不能洗掉原始的自己。
  smallest_next_test: Create a private `inner-archive` repo with README, folders,
    templates, `maps/index.md`, and 3 to 5 real notes; then run one AI-assisted weekly
    reflection that preserves raw text while suggesting links and themes.
pca_sdd_v01:
  captured_at: 2026-06-11
