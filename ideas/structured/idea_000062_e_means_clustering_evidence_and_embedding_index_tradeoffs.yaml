id: idea_000062
title: e-means clustering evidence and embedding index tradeoffs
created_at: '2026-11-15'
type: concept
tags:
- clustering
- e-means
- vector-quantization
- retrieval
- evidence-gates
status: structured
problem_statement:
  raw: 固定高維embedding分群時，如何判斷e-means相較Lloyd的時間—品質改善能否轉移到目標索引，而不把圖示、MSE或作者報告當成本機成效？
  normalized: Given fixed embedding datasets, compare e-means and Lloyd under matched
    initialization, quality criteria and timing boundaries; keep source claims separate
    from local evidence.
  structure:
    given: 使用者完整供稿、八張教學圖及arXiv:2611.09501v1
    optimize: 可回查的更新機制理解與公平比較判斷
    constraints:
    - 本次只記錄、重繪與數學檢核；不啟動效能重現
    - loss、epochs、總時間與下游召回各自定義
    - 資料與硬體未指定；容量Unknown
    - 來源所列10倍加速保留特定條件，沒有普遍保證
summary: 完整保存e-means教學供稿並逐張重繪，建立Lloyd、N/S的EMA、cosine、revival、finalization及scaling
  laws的證據分層。採用決策等待目標資料與召回門檻；不替換Idea OS現有關係圖分群。
assumptions:
- embedding距離必須對應所需相似性；同群不代表重複或同類
- k-means++為初始化策略，可搭配不同求解器
- 獨立NumPy反例無直接來源，待確認
- 數學檢核與作者實驗不能取代本機及下游驗證
evidence:
- 使用者1019個邏輯行（1018個換行）文字與八張圖已原樣保存並記錄SHA-256
- 本次確認arXiv:2611.09501v1及作者專案頁；結果屬作者報告
- 本repo分群引擎依merge-readiness關係取連通分量，並未使用k-means
baseline:
- Lloyd固定初始化
- Lloyd搭配k-means++初始化
- MiniBatchKMeans
- e-means及組件消融（候選設計，未執行）
metrics:
- 固定品質的端到端時間與固定預算的train/test MSE
- Recall@10、峰值記憶體、計時邊界及seeds分布
insights:
- 同目標、不同更新頻率可以改變成本與最佳化路徑；下游品質仍需獨立評估
