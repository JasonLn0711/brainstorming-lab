  horizon: 2 to 4 weeks
  scope:
  - patient management
  - LINE notification mock or adapter
  - return-visit reminder
  - medication reminder
  - SQLite
- phase: Phase 2
  scope:
  - symptom tracking
  - questionnaire
  - staff dashboard
- phase: Phase 3
  scope:
  - AI follow-up suggestion
  - non-adherence risk scoring
  - adaptive routing
- phase: Phase 4
  scope:
  - FHIR or EMR integration after workflow validation
real_world_pressure_test:
  setting: A small urology clinic uses the system for BPH follow-up after prescribing
    Tamsulosin and setting a 14-day return visit.
  expected_failure_modes:
  - patient ignores Day 3 check-in
  - patient reports no improvement on Day 7
  - staff dashboard becomes too noisy
  - reminder channel fails or patient changes contact route
  - system wording sounds like medical advice rather than follow-up support
  smallest_observable_test: Run five synthetic patient timelines and measure whether
    staff can identify who is improved, not improved, no-response, returned, or overdue
    within one minute.
  confirm_or_kill_metric: Continue only if a non-technical reviewer can understand
    the workflow, safety boundary, and next staff action without the system making
    clinical claims.
