assumptions:
- Small clinics have a concrete pain point around missed follow-up, weak chronic-condition
  tracking, and patient retention.
- A workflow CRM is easier to validate and adopt than a diagnostic AI product.
- LINE is a plausible first messaging channel in Taiwan-facing clinic workflows, while
  SMS and email can remain later adapters.
- The first version can use synthetic or manually entered demo data and avoid storing
  real patient data.
- Clinic staff need a simple operational dashboard more than a complex AI explanation
  screen in v1.
- The system should record status and responses, not infer diagnosis or treatment.
- Future AI value should be attached to routing and workflow suggestions, not autonomous
  clinical decisions.
evidence:
- '2026-05-19 user-provided idea: CRM patient management for return-visit reminders,
  medication-time tracking, and follow-up status is highly feasible as an MVP.'
- 'User framing: the current research/product axis is AI Systems Engineering for Real-world
  Deployment, not building a full hospital HIS.'
- 'User-provided MVP cut: patient creation, return-visit reminder, medication reminder,
  and follow-up status.'
- 'User-provided workflow: after BPH visit and Tamsulosin prescription, system sends
  Day 1 medication reminder, Day 3 symptom check-in, Day 7 follow-up, and Day 14 return-visit
  reminder.'
- The prompt includes a possible future relation with the existing urology previsit
  demo, HIS, EMR, and CRM; as of 2026-05-19 it is linked into planning as locator/status
  only, not as a new execution lane.
baseline:
- Full HIS or EMR build, which is too broad for MVP validation.
- Full clinical AI diagnosis product, which is harder to validate, regulate, and adopt.
- Manual phone-call follow-up by clinic staff without structured status tracking.
- Calendar-only reminders that do not capture symptom response, non-response, or return-visit
  status.
- Generic CRM that lacks clinical follow-up timing, medication adherence, and safety
  boundary language.
metrics:
- Percentage of patients with a created follow-up plan before leaving the clinic.
- Reminder delivery success rate by channel.
- Patient response rate to Day 3 and Day 7 check-ins.
- Return-visit completion rate compared with a manual baseline.
- Staff time needed to create and review a follow-up plan.
- Number of missed, late, or unresolved follow-up items per week.
- Count of cases requiring staff escalation because of non-response or worsening self-report.
insights:
- The minimum product is a medical workflow management system, not medical AI.
- The wedge is patient retention and continuity after the visit, not the reminder
  feature alone.
- Urology is a good first specialty because chronic symptoms, medication response,
  and return visits are concrete and easy to explain.
- A demo should show the staff action of pressing "Create Follow-up" after a visit,
  then the automatic timeline.
- AI should enter only after the workflow is observable: adaptive reminder frequency,
    adaptive questionnaires, non-adherence detection, and explainable workflow suggestions.
- The research value is operational AI systems under real-world deployment constraints: usability,
    reliability, privacy, accountability, and human review.
