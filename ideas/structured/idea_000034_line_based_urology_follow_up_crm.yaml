maturity_action: generate experiment plan
first_principle:
  scarce_resource: clinic continuity after the visit, not model sophistication
  core_object: a follow-up workflow that keeps patients, reminders, symptoms, and
    return visits visible to staff
  not_the_core:
  - full HIS
  - full EMR
  - autonomous diagnosis
  - autonomous treatment recommendation
  - full FHIR interoperability
  - hospital-wide platform
  core_question: Can a small clinic understand, trust, and try a minimal follow-up
    CRM today?
  smallest_useful_unit: one follow-up plan created after one synthetic urology visit
    with medication reminders, symptom check-ins, and return-visit reminder.
  decision_boundary: Keep v1 as workflow CRM; add AI only when the baseline workflow
    has observable events and clear human-review decisions.
mvp_v1:
  roles:
  - clinic staff
  - physician
  - patient
  patient_fields:
  - name
  - phone_or_line_id
  - condition
  - medication
  - return_visit_date
  - consent_status
  workflow:
  - visit closes with diagnosis, medication, and return-visit target
  - staff creates follow-up plan
  - system schedules medication and return-visit reminders
  - system sends Day 3 and Day 7 symptom check-ins
  - staff dashboard shows improved, not improved, no response, returned, or overdue
  notification_channels:
  - LINE Messaging API first
  - SMS later
  - email later
  explicit_non_goals:
  - clinical diagnosis
  - triage decision
  - medication change recommendation
  - real patient data in prototype
  - HIS or EMR integration
his_emr_boundary:
  short_rule: HIS manages hospital or clinic operations; EMR manages the patient's
    medical record; this CRM manages post-visit follow-up workflow.
  his:
    full_name: Hospital Information System
    chinese: 醫院資訊系統
    owns:
    - registration
    - check-in queue
    - billing and insurance flow
    - inpatient bed management
    - pharmacy routing
    - lab and imaging scheduling
    - administrative reports
    - next-visit appointment logistics
    real_world_example: A urology patient registers, checks in, receives a visit number,
      pays, gets prescription routing, schedules exams if needed, and books a return
      visit.
  emr:
    full_name: Electronic Medical Record
    chinese: 電子病歷
    owns:
    - chief complaint
    - history
    - medication and allergy history
    - diagnosis
    - SOAP note
    - lab results
    - imaging reports
    - physician orders
    - treatment and follow-up plan
    real_world_example: A physician records frequent urination, nocturia, BPH assessment,
      Tamsulosin order, and a two-week return plan.
  follow_up_crm:
    owns:
    - medication reminders
    - symptom check-ins
    - return-visit reminders
    - response status
    - no-response or overdue queue
    - staff-visible post-visit follow-up summary
    positioning: A patient follow-up CRM layer outside HIS and EMR.
  mvp_integration_rule:
  - Do not start by integrating formal HIS or EMR.
  - Use manual staff entry for synthetic or demo data first.
  - Consider read-only HIS or EMR data only after workflow validation.
  - Consider EMR write-back last because it increases clinical and compliance responsibility.
crm_definition:
  short_rule: CRM means Customer Relationship Management; in this medical version,
    it manages the long-running relationship and interaction lifecycle between the
    patient and the clinic rather than the medical record itself.
  owns:
  - contact route and interaction history
  - next contact schedule
  - return-visit and medication reminder state
  - response, no-response, overdue, and retention signals
  - staff follow-up queue
  real_world_instances:
  - domain: healthcare
    example: Urology clinic tracks BPH follow-up, medication reminders, symptom improvement,
      missed return visits, and staff callbacks.
  - domain: insurance
    example: Agent CRM tracks last contact, family or policy context, renewal timing,
      birthday greetings, and next follow-up reminders.
  - domain: automotive
    example: Tesla-like sales CRM tracks model interest, test drive, order status,
      cancellation, and follow-up messaging.
  - domain: streaming
    example: Netflix-like engagement CRM tracks viewing, inactivity, churn risk, and
      personalized re-engagement.
  - domain: education
    example: School retention CRM tracks absence, payment, academic risk, counseling
      outreach, and possible leave of absence.
