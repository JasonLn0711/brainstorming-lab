problem_statement:
  raw: Given outpatient clinics where care often stops after the patient leaves the
    consultation room, build the smallest follow-up CRM that keeps medication reminders,
    symptom check-ins, and return-visit reminders visible to clinic staff without
    becoming a full HIS, EMR, or clinical AI system.
  normalized: Given post-visit outpatient follow-up gaps, optimize a clinic-grade
    patient follow-up workflow under constraints of MVP scope, privacy, staff usability,
    messaging reliability, no autonomous diagnosis, no full HIS/EMR integration, and
    future AI extensibility.
  structure:
    given: post-visit outpatient follow-up gaps in small clinics
    optimize: a clinic-grade patient follow-up workflow
    constraints:
    - MVP scope
    - privacy and consent boundary
    - staff usability
    - messaging reliability
    - no autonomous diagnosis
    - no full HIS or EMR integration in v1
    - future AI extensibility
summary: 'A LINE-based urology follow-up CRM MVP for clinic workflow management: create
  a patient follow-up record after a visit, schedule medication reminders, send symptom
  check-ins, remind return visits, and show follow-up status to staff. The product
  wedge is not medical AI or a full hospital system; it is retention, adherence, and
  continuity of care after the patient leaves the clinic. AI can later support adaptive
  follow-up routing, non-adherence detection, and explainable workflow suggestions,
  but v1 should stay operational and demoable.'
source_note_zh: 點子核心：病人離開診間後，醫療流程常常斷掉。MVP 不做完整 HIS、EMR、FHIR 或診斷 AI，而是做診所等級 Follow-up
  CRM：病人建立、LINE/SMS/Email 回診提醒、吃藥提醒、症狀改善追蹤、回診狀態。第一個合理版本可聚焦在 LINE-based Urology Follow-up
  CRM。這次記錄同時保留 CRM 定義、HIS/EMR/CRM 邊界、real-world instances，以及 urology previsit demo + HIS
  + EMR + CRM 的 Mermaid diagrams；但先不把它同步或綁進現有 planning。
