status: structured
problem_statement:
  raw: 如何在自己的電腦，以 GPT 作為前端主控大腦，讓 Nemotron 3.5 Super 負責後端工程決策與執行？ 補充：OpenCode 能否統一整合
    GPT、Super、Nano 與工具？RTX 5080 已移交其他研究生，實驗室改用 GX10。 2026-11-16：希望在 GX10 以 OpenCode、GPT-6.1-max
    與 qwen-3.8-next-flash nvfp4 建立 MVP，並由 Telegram 或其他方式遠端操作；這是近期很想完成的目標之一。
  normalized: Given a personal Ubuntu workstation and a GPT-led coding workflow, identify
    a bounded hybrid agent architecture under constraints of model availability, credentials,
    cloud data transfer, local execution permissions, hardware capacity, and verifiable
    handoff.
  structure:
    given: GX10 lab workstation with GPT-led coding workflow
    optimize: bounded cross-model engineering handoff with verifiable local execution
    constraints:
    - model availability and account terms pending verification
    - cloud data boundary
    - local tool approval and operating-system isolation
    - hardware capacity and context memory
    - no installation or live run activated
summary: 延續 11/04 GPT／Nemotron 混合架構，11/16 Jason 明示這是近期很想完成的目標之一；最新候選為 GPT-6.1 主控、共用
  Qwen 推論服務的唯讀 workers，以及私有 Web／SSH 與 Telegram 控制層。保留 Nemotron 歷史選項；產品頁面查核與 GX10 實測分開。
assumptions:
- 使用者偏好 GPT 作為主控、Nemotron 3.5 Super 作為工程決策與執行模型。
- OpenCode 版本、provider 支援、ChatGPT 帳戶授權、NVIDIA endpoint 與 Ollama 標籤均待查核。
- ASUS Ascent GX10／GB10／128 GB 為提供稿的暫定規格，尚未取得實機證據。
- OpenCode 完整協調、NVFP4 單台支援與 Super／Nano 共存是待查核的方案主張。
- 11/16 最新偏好是 Qwen 本地 workers；尚未實測選型，Nemotron 方案保留歷史。
- gpt-6.1-max 是使用者目標用語；官方頁列 gpt-6.1-sol 與獨立 reasoning.effort=max，帳戶及 OpenCode 實際可用性待核。
- W47 Red／待重評；近期目標尚未核配工時或期限。
evidence:
- 2026-11-04 使用者要求詳實保存所附架構長文；完整來源位於 companion/source.md。
- 2026-11-04 使用者明確更正：RTX 5080 已移交其他研究生，實驗室目前改用 GX10，並要求記憶。
- 2026-11-16 使用者完整供稿與近期目標宣告：source-2026-11-16-qwen-remote.md。
- 2026-11-16 官方頁面支持 FP4-Local／Spark 路線、OpenCode V2 設定及 Web 配對、Telegram long polling；逐項界線見
  update-2026-11-16-qwen-remote.md。未執行 GX10 推論或代理。
baseline:
- 提案：固定同一組任務與驗收，後續另行啟動 GPT-only、Qwen-only、GPT＋Qwen 比較；目前未量測。
metrics:
- 提案指標，未量測：task success rate、tool-call validity、end-to-end p50/p95、peak unified memory、cost
  per successful task、security violation count。
insights:
- 模型提出工具請求，執行框架執行，權限與隔離層控制作用範圍。
- 使用者對角色分工的偏好已保存；第三方工具選擇與部署尚未採納。
- 原文範例與測試數字是來源主張，未構成本輪實測證據。
- 多個代理角色共用一個模型服務；服務 owner、排程與 KV cache 是獨立設計責任。
- 遠端指令入口、工作授權、模型路由、工具執行與 OS 隔離分層驗收。
- Telegram gateway 先查既有 Hermes owner；模型服務先查 ai-inference-platform 的資源與 API 邊界。
