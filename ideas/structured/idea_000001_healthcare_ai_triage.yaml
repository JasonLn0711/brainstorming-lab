problem_statement:
  raw: Given overloaded clinical intake and ASR-driven patient speech input, optimize
    safe symptom understanding and human review routing under safety, audit, privacy,
    and transcript-error constraints.
  normalized: Given overloaded clinical intake and noisy ASR-driven patient speech
    input, optimize safe symptom understanding, uncertainty handling, and human review
    routing under constraints of safety, auditability, privacy, transcript error,
    accent variation, near-homophone clinical terms, and clinician oversight.
  structure:
    given: overloaded clinical intake with patient speech input
    optimize: safe symptom understanding, uncertainty handling, and which cases need
      human review first
    constraints:
    - safety
    - auditability
    - privacy
    - ASR transcript error
    - accent and pronunciation variation
    - near-homophone clinical symptom terms
    - clinician oversight
summary: 'A clinical triage assistant that structures patient intake, flags uncertainty,
  and routes cases to clinicians with evidence rather than replacing medical judgment.
  The current sharp failure mode is ASR-driven semantic drift: a plausible-sounding
  but wrong transcript can push embedding retrieval toward unrelated terms, causing
  the question-answer flow to miss the intended symptom. A safer architecture treats
  native audio-capable multimodal models such as Gemma 4 E2B/E4B as candidate audio
  semantic verifiers beside ASR, not as autonomous medical decision makers. The next
  bold experiment is to test Gemma 4 E2B as the primary short-audio interpreter and
  measure whether direct audio-to-structured-intake reduces ASR-induced semantic drift
  without increasing silent clinical over-correction.'
assumptions:
- The useful output is safer prioritization, not autonomous diagnosis.
- Clinicians need provenance and uncertainty markers more than another chat surface.
- A small synthetic workflow can test review-burden reduction before any real patient
  data.
- ASR transcripts are useful but cannot be treated as ground truth when the downstream
  matcher depends on embeddings or symptom-keyword similarity.
- A native-audio multimodal model may use speech acoustics plus clinical prompt context
  to recover the intended symptom better than a text-only LLM reading a bad transcript.
- The multimodal model can reduce ASR semantic drift, but it can also hallucinate,
  normalize away uncertainty, or overfit to the prompt; disagreement must trigger
  confirmation rather than silent correction.
- For clinical intake, the safe product behavior is ask-to-confirm or route-to-human
  when ASR and audio interpretation disagree.
- A direct-audio Gemma 4 E2B path is experimentally valid only on synthetic or consented
  short clips, fixed schemas, and staff-review boundaries; success in this setting
  does not imply production clinical deployment.
- Removing traditional ASR from the primary path removes one visible artifact, so
  the model must still produce a model-understood transcript or short evidence trace
  for audit.
insights:
- This idea shares the same reviewer-assist pattern as cybersecurity candidate review.
- The first metric should be reduction in time-to-first-safe-action.
- The key issue is not only word error rate; it is symptom-level semantic error after
  transcript noise enters retrieval or embedding matching.
- 'A dual-track audio pipeline can separate transcript generation from symptom interpretation:
  ASR provides readable evidence, while an audio-understanding model provides a second
  semantic hypothesis.'
- The model should output symptom candidates, uncertainty, and the exact confirmation
  question, not a final diagnosis.
- A good clarification question is narrow and confirmatory, such as asking whether
  the patient meant burning pain during urination.
- 'The direct-replacement experiment should be judged against downstream safety, not
  only transcript quality: correct symptom, correct next question, negation handling,
  and whether uncertainty becomes staff review or patient confirmation.'
- A strong result would justify making Gemma the primary short-answer interpreter
  in a bounded demo; it would still require transcript-like trace logging and high-risk
  staff-review gates.
