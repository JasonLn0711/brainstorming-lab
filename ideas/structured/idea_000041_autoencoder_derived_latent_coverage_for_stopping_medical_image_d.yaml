pressure_test:
  setting: Retrospective replay on a complete prostate MRI or brain MRI pool with
    hidden full-data performance.
  expected_failure_modes:
  - AE latent space learns scanner/site/protocol artifacts instead of clinical task
    variation.
  - Farthest-point or high-novelty sampling chases bad scans, motion artifacts, or
    metadata errors.
  - Coverage gain plateaus even though downstream external validation still improves.
  - The gate stops too early for rare pathology or underrepresented subgroup cases.
  - Metadata-stratified sampling beats Omega-AE, making the neural component unnecessary.
  smallest_observable_test: Start with 500 images, add 100-image batches by each baseline
    strategy, retrain the same downstream model per round, and compare performance
    curves against full-data performance.
  confirming_metric: Omega-AE reaches n95 with substantially fewer samples than random
    and metadata-only baselines while keeping false-stop rate low on external validation.
  revise_or_kill_metric: Revise or park if coverage gain fails to predict downstream
    gain, if false-stop rate is unacceptable, or if metadata-only/radiomics baselines
    are equally good.
experiment_plan:
- Choose one narrow domain first, preferably prostate MRI or brain MRI, and define
  the downstream task before touching model variants.
- Build a clean feature table with DICOM-derived metadata, quality proxies, and image
  identity fields before training AE models.
- Train vanilla AE, denoising AE, VAE/beta-VAE, and a small MAE/patch-MAE under the
  same preprocessing split.
- Build selection functions for random, metadata-stratified, radiomics coreset, AE
  coreset, VAE coreset, MAE coreset, and Omega-AE.
- Fit a downstream segmentation or classification model after each replay round and
  record n95, external validation performance, calibration, false stops, and review
  burden.
- Add a clinician/data-review step only for high-novelty low-density cases to classify
  rare-but-useful versus garbage outlier.
out_of_scope:
- A universal medical image discriminator.
- A claim that AE reconstruction error alone proves data sufficiency.
- Production clinical deployment.
- Patient-identifiable raw evidence in this repo.
- Large checkpoints, private datasets, or generated run artifacts in git.
evidence_gaps:
- Need a concrete dataset identity and task before moving from concept to implementation.
- Need primary-source literature notes for VAAL, AE-based medical active learning,
  MAE medical imaging, VQ-VAE/codebook coverage, and diffusion AE variants.
- Need agreement on whether the target is segmentation, classification, anomaly triage,
  or data-governance reporting.
- Need a small no-PHI fixture or public dataset substitute for initial script validation.
- Need clinician or domain-review criteria for rare-but-useful versus artifact/outlier.
