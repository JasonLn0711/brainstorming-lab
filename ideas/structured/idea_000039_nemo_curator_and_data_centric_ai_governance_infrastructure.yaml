        - "ASR evaluation"
        - "165 cognitive-state analysis"
        - "reviewer routing"
        - "synthetic public-safe dataset creation"
  valuable_optional_inputs:
    metadata:
      fields:
        - timestamp
        - "call duration"
        - source
        - region
        - "speaker role"
        - "language hint"
        - "risk label"
    calibrated_transcripts:
      example: "500 human-corrected short segments"
      uses:
        - bootstrap
        - calibration
        - "quality estimation"
        - "active learning"
  outputs:
    data_artifacts:
      - "cleaned segments"
      - "candidate training corpus"
      - "candidate evaluation corpus"
      - "filtered-out quarantine set"
    metadata_intelligence:
      - "audio quality information"
      - segmentation
      - VAD
      - "transcript candidates"
      - "token or segment confidence"
      - "dataset filtering result"
      - deduplication
      - "hard-case mining labels"
      - "embedding or semantic clusters"
      - "dataset governance information"
    lineage_fields:
      - provenance
      - "processing history"
      - "ASR version"
      - uncertainty
      - "reviewer status"
      - "release boundary"
  production_risks:
    - "dataset drift"
    - "annotation inconsistency"
    - "ASR uncertainty explosion"
    - "metadata loss"
    - "processing-history gaps"
  identity_frame: "speech governance systems researcher"
