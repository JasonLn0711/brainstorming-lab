maturity_action: "generate experiment plan"
pressure_test:
  setting: "A restricted 165 antifraud or clinical-triage audio corpus contains noisy calls, silence, overlapping speech, uncertain ASR transcripts, sensitive details, and only limited reviewer time."
  expected_failure_mode: "The project treats ASR text as clean training data, loses acoustic and uncertainty signals, leaks sensitive evidence, or spends reviewer time on low-value duplicate/noisy samples."
  smallest_observable_test: "Curate 20 synthetic or authorized short audio segments with duration, ASR output, quality flag, uncertainty bucket, reviewer-route decision, and public-safe export status."
  confirm_revise_or_kill_metric: "Keep the curation approach if it improves reviewer-reconstructable data quality and reduces low-value review burden compared with raw transcript-first processing."
data_factory_frame:
  core_loop:
    - "collect raw data"
    - "clean and normalize"
    - deduplicate
    - "score quality"
    - "route uncertain or high-value samples to reviewers"
    - "generate or validate synthetic data"
    - "train or evaluate models"
    - "deploy and collect new data"
  modalities:
    - text
    - audio
    - image
    - video
    - "multimodal interaction traces"
  user_research_fit:
    - "165 antifraud speech curation"
    - "ASR uncertainty and acoustic-quality gates"
    - "review-scarcity-aware data routing"
    - "reconstructable governance and trace logs"
    - "hidden-state observable quality control"
speech_data_system:
  layer_1_raw_audio:
    purpose: "Preserve and score the original speech signal before converting it into text."
    observables:
      - "signal-to-noise ratio"
      - clipping
      - silence
      - "overlapping speech"
      - bitrate
      - encoding
      - "call quality"
      - VAD
      - "audio normalization"
  layer_2_uncertainty_aware_asr:
    purpose: "Treat transcript as uncertain derived evidence rather than ground truth."
    mechanisms:
      - "token confidence"
      - "N-best decoding"
      - "secondary decoding for low-confidence segments"
      - "human review flags"
      - "dialect and code-switching metadata"
      - "high-risk uncertain-token preservation"
      - "multi-hypothesis semantic reasoning"
  layer_3_semantic_uncertainty:
    purpose: "Propagate ASR uncertainty into embeddings, retrieval, classification, and risk scoring."
    risk: "A low-confidence phrase such as investment group versus investment-advisor group can change downstream scam interpretation."
  layer_4_reviewer_scarcity:
    purpose: "Manage limited human review capacity through triage, prioritization, uncertainty routing, and escalation."
    failure_mode: "Speech processing capacity scales while human review capacity does not, creating review bottleneck collapse."
  layer_5_governance:
    purpose: "Make the speech pipeline reconstructable, auditable, and institutionally accountable."
    reconstruction_trace:
      - "raw audio quality"
      - "ASR confidence"
      - "N-best alternatives"
      - "semantic ambiguity"
      - "routing threshold"
      - "reviewer queue state"
      - "final decision"
analog_telephone_pipeline:
  framing: "Curator's value for analog telephone speech is turning dirty uncontrolled calls into an ASR-ready and governance-ready data universe."
  raw_call_conditions:
    - "8 kHz PSTN limitation"
    - "telephone compression"
    - "mobile quality instability"
    - "background TV or room noise"
    - "hold time and silence"
    - "citizen and police overlap"
    - "speaker interruption"
    - "Taiwanese and Mandarin mixing"
    - "elderly voices"
    - "local accents"
    - "emotional or crying speech"
    - "incomplete sentences"
  pipeline_steps:
    audio_profiling:
      fields:
        - duration
        - "sample rate"
        - "clipping ratio"
        - "silence ratio"
        - SNR
        - "channel count"
        - "codec artifact score"
      purpose: "Detect whether the dataset is already damaged before training."
    bandwidth_aware_filtering:
      pstn_band: "roughly 300 Hz to 3400 Hz"
      purpose: "Tag or filter high-distortion segments so downstream ASR and review know the speech evidence quality."
    vad_segmentation:
      target_chunk: "4 to 15 seconds"
      purpose: "Remove blank or non-speech regions and split long calls into ASR-trainable segments."
    speech_quality_scoring:
      examples:
        clear_complete_sentence: 0.95
        overlapping_speech: 0.42
        severe_noise: 0.18
        barely_audible: 0.05
      purpose: "Prefer high-value training segments over blind data-volume growth."
    bootstrap_transcription:
      method: "Use a strong ASR model such as Whisper-large-v3 as weak supervision, then score, filter, rerank, or review transcripts."
      risk: "Wrong labels can be memorized by small ASR fine-tuning runs."
    confidence_filtering:
      keep: "high-confidence segments"
      review: "mid-confidence or high-impact segments"
      discard: "very low-confidence or unusable segments"
    deduplication:
      exact_duplicate: "common greetings and repeated hotline phrases"
      semantic_duplicate: "near-meaning repeats such as investment group versus LINE investment-advisor group"
      purpose: "Avoid overfitting fixed phrases and wasting review budget."
    speaker_metadata:
      fields:
        - speaker_role
        - emotion
        - speech_rate
        - overlap_ratio
        - uncertainty
      roles:
        - citizen
        - officer
    hard_case_mining:
      targets:
        - crying
        - Taiwanese
        - "elderly voice"
        - "very low volume"
        - mixed_audio
        - "scam terminology"
        - "proper nouns"
      purpose: "Improve ASR robustness through difficult samples instead of only clean weather flying."
    synthetic_augmentation:
      transformations:
        - "telephone noise"
        - "codec degradation"
        - "packet loss"
        - reverb
        - "PSTN simulation"
        - "LINE or mobile mic simulation"
      purpose: "Increase domain robustness while preserving augmentation provenance."
    dataset_governance:
      loop: "new calls -> automatic assessment -> uncertainty routing -> active learning -> retraining candidate"
      purpose: "Maintain a continuously curated speech system instead of a one-time training set."
chinese_asr_failure_governance:
  framing: "NeMo Curator is not a Chinese ASR miracle model; it is the governance layer around fallible ASR models."
  asr_model_examples:
    - Whisper
    - "NVIDIA NeMo ASR"
    - Paraformer
    - FunASR
    - wav2vec2
    - SenseVoice
    - Conformer
  failure_modes:
    homophone_explosion:
      examples:
        - "投資 / 投知 / 投支"
        - "保證獲利 / 保證活力"
      governance_response:
        - "mark low-confidence scam-relevant tokens"
        - "preserve N-best alternatives"
        - "route high-impact ambiguity to review"
    taiwanese_mandarin_code_switching:
      example: "伊講欲投資這个平台"
      governance_response:
        - "tag dialect/code-switch segments"
        - "avoid treating one Mandarin transcript as final truth"
    proper_nouns_and_finance_terms:
      examples:
        - "MAX crypto"
        - USDT
        - "LINE group names"
        - "stock symbols"
      governance_response:
        - "use domain lexicon hints"
        - "keep alternatives for downstream semantic reasoning"
    emotional_and_fragmented_speech:
      examples:
        - crying
        - breathing
        - pauses
        - repetition
        - interruption
      governance_response:
        - "carry acoustic/emotional uncertainty into review route"
    pstn_bandwidth_loss:
      issue: "8 kHz PSTN loses high-frequency information and increases Mandarin consonant confusion."
      governance_response:
        - "tag bandwidth-limited evidence"
        - "calibrate confidence and routing thresholds by channel quality"
  target_research_direction: "uncertainty-aware ASR governance"
  core_claim: "The goal is not 100 percent ASR correctness; the goal is a system that knows when it may be wrong and remains controllable."
  operational_artifact_rule: "AI outputs are probabilistic operational artifacts."
