decision_autonomy_erosion:
  definition: "A measurable reduction in the target's practical ability to pause, verify, ask outsiders, challenge authority, reject urgency, or exit without emotional, social, or financial penalty."
  observable_signals:
    - "external verification becomes discouraged or framed as betrayal"
    - "the target is moved from public or accountable spaces into private channels"
    - "the interaction imposes time pressure before independent review can happen"
    - "authority becomes concentrated in one actor, guru, mentor, platform, or group"
    - "doubt is reframed as weakness, disloyalty, lack of courage, or lack of sophistication"
    - "commitments escalate from attention to identity, secrecy, money, credentials, privacy, or irreversible action"
  output_label: "influence transparency signal, not final scam determination"
