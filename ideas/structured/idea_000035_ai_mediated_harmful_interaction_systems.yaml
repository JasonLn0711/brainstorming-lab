hard_negative_fixture:
  purpose: "Prevent the system from becoming a moral panic machine that treats ordinary persuasion, care, or authority as scam."
  required_cases:
    - "normal mentor giving urgent but legitimate advice"
    - "family member requesting money during a real emergency"
    - "legal marketing or sales funnel with clear opt-out"
    - "investment education without private extraction or verification suppression"
    - "political or community mobilization with public accountability"
    - "religious or support-community recruitment without isolation or secrecy"
    - "emotional support relationship without money, secrecy, or dependency exploitation"
    - "legitimate professional authority that encourages second opinions"
  pass_condition: "The system should not flag urgency, intimacy, or authority alone; risk should require a trajectory pattern such as isolation plus verification suppression plus commitment escalation."
pressure_test:
  setting: "A 30-day mixed LINE, Threads, voice-note, and private-message scenario where legitimate mentors, aggressive marketers, fan/community organizers, and scam-like actors all use friendly language, topic shifts, and occasional investment or opportunity talk."
  expected_failure_mode: "A token classifier either misses slow grooming because no explicit scam words appear, or overflags legitimate persuasion because it cannot separate influence gradient, consent, external verification, and reviewer-visible hard negatives."
  smallest_observable_test: "Build a consent-safe or synthetic 12-trajectory fixture with turn-level annotations for influence dynamics, ASR/OCR/noise variants, benign hard negatives, and delayed escalation. Compare keyword, single-message embedding, and trajectory-feature baselines."
  decision_metric: "Pass if the trajectory model or rubric surfaces review-worthy risk earlier than explicit extraction requests, gives reconstructable evidence, keeps benign hard-negative false positives low enough for review, and reduces reviewer time per useful candidate compared with single-message baselines."
