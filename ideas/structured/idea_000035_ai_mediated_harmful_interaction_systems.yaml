status: execution_ready
problem_statement:
  raw: "Given that animal communication, low-resource meaning inference, and modern scam or persuasion systems often lack stable label pairs, ask whether the useful research object is not direct translation or scam classification but latent interaction dynamics that can be inferred from sequence structure, context, behavior outcomes, and longitudinal changes. The locked scope is AI-mediated harmful interaction trajectory modeling, focused only on interaction structure reconstruction."
  normalized: "Given high-impact communication where surface tokens are unstable, labels are sparse, ASR may distort text, and meaning emerges through interaction outcomes, optimize reconstruction of harmful interaction structure under constraints of no semantic interpretation as the first task, non-binary scam boundaries, adaptive manipulation, cross-language variation, multimodal signals, privacy, limited reviewer labor, hard-negative protection, scope explosion, and no automated final fraud determination."
  structure:
    given: "high-impact human or animal communication streams whose meaning is not reliably recoverable from paired labels or single-message text"
    optimize: "interaction structure reconstruction for latent harmful influence trajectories"
    constraints:
      - "do not start with semantic understanding"
      - "do not train a large model as the first move"
      - "do not frame the project as another scam classifier"
      - "missing or sparse label pairs"
      - "surface wording changes quickly"
      - "ASR and OCR may distort token-level evidence"
      - "persuasion and scam risk form an influence gradient, not a clean binary"
      - "harmful interaction often unfolds over days or weeks"
      - "benign marketing, mentorship, fandom, religion, politics, and sales can look superficially similar"
      - "adaptive AI agents may personalize manipulation in real time"
      - "privacy and consent boundaries limit raw evidence collection"
      - "human reviewers need reconstructable evidence, not black-box suspicion"
      - "the system must not make final legal or enforcement determinations"
      - "hard negatives with legitimate urgency, authority, mentorship, politics, religion, marketing, and family support must be preserved"
summary: "Locked scope: AI-mediated harmful interaction trajectory modeling. The first task is only interaction structure reconstruction, not semantic understanding, not LLM fine-tuning, and not a general scam detector. The research object is how interaction phase transitions, escalation dynamics, and trust-state evolution can be reconstructed from conversation topology, timing, response patterns, channel migration, verification suppression, dependency reinforcement, and commitment escalation. The deeper governance question can come later: how scaled AI-mediated interaction changes human decision processes faster than institutions can review and reconstruct them."
source_note_zh: "鎖定範圍：AI-mediated harmful interaction trajectory modeling。第一件事只做 interaction structure reconstruction，先不碰 semantics、不先 train 大模型、不做一般 scam classifier。核心只研究 interaction phase transition、escalation dynamics、trust-state evolution。"
human_note: ideas/2026-05-22-ai-mediated-harmful-interaction-systems.md
assumptions:
  - "In animal communication, direct label pairs such as whale sound to human sentence are usually unavailable; the first useful target is functional structure rather than literal translation."
  - "In scam and persuasion analysis, surface wording changes faster than supervised labels can remain stable."
  - "Token-level semantics are insufficient when the core risk is how an interaction changes trust, urgency, dependency, and willingness to verify."
  - "Harmful influence should be treated as a gradient that includes scams, coercive marketing, political persuasion, cult-like dependency, manipulative livestreams, and high-pressure investment communities."
  - "Longitudinal manipulation can begin with ordinary conversation and only later escalate into financial, emotional, or privacy harm."
  - "ASR, OCR, translation, and embedding errors make single-text pipelines brittle; trajectory-level and behavior-graph features may be more robust."
  - "Adaptive AI raises the risk from fixed scam scripts to real-time manipulation systems that change strategy based on the target person's reactions."
  - "A safe research system should surface risk patterns for human review and influence transparency, not decide guilt, fraud, takedown, warning, or enforcement."
  - "The deeper measurement object may be autonomy compression: whether the target has fewer practical options to pause, verify, consult outsiders, challenge authority, or exit without emotional penalty."
  - "The strongest benchmark will be dominated by hard negatives, because legitimate urgency, legitimate authority, emotional support, activism, religion, mentoring, and sales can share surface cues with manipulative interaction."
  - "Structure is the first stable object because wording can change while escalation pattern, pressure timing, trust-building sequence, and migration path are harder to fully hide."
  - "The relationship itself can be modeled as a latent state machine: stranger, rapport, trust, attachment, isolation, extraction, and recovery or collapse."
  - "The five-layer research stack should be problem definition, structure-first reconstruction, temporal modeling, institutional capacity/review-scarcity analysis, and later simulation."
evidence:
  - "2026-05-22 brainstorm: the user connected unsupervised animal communication, cross-modal alignment, emergent communication decoding, and the impossibility of whale-to-human label pairs to scam detection."
  - "2026-05-22 brainstorm: the user identified the shared principle that semantics may come from environment interaction and behavior outcomes rather than text."
  - "2026-05-22 brainstorm: the user reframed scam detection from keywords and binary labels toward interaction dynamics such as trust building, urgency, isolation, authority illusion, challenge avoidance, and rationalization."
  - "Prior-project observation from idea_000007: scam research value is better measured as high-information behavior discovery per reviewer hour than raw candidate count."
  - "Prior-project observation from idea_000021: adaptive flow and dynamic graph models may fit noisy scam-candidate discovery better than fixed shortest-path or fixed source-arm workflows."
  - "Prior idea_000031 analogy: low-grounding decipherment problems should first rank structure hypotheses and preserve uncertainty rather than produce confident translations."
  - "Prior idea_000015 observation: voice understanding pipelines must survive noisy input, ASR errors, latency, and system-level constraints rather than assuming clean transcripts."
  - "2026-05-22 follow-up synthesis: the core research claim should be that scam-like harm is a longitudinal influence trajectory that erodes decision autonomy, rather than a static text classification problem."
  - "PreScam arXiv 2605.12243, checked 2026-05-22: conversational scams unfold through multi-turn manipulation; the benchmark structures 177,989 reports into 11,573 scam instances, annotates scammer psychological actions and victim responses, and finds current models still struggle with progression modeling."
  - "Nature Human Behaviour 2025, checked 2026-05-22: conversational LLM persuasion matters because direct dialogue and personalization can lower the historic cost of tailoring persuasive messages."
  - "Scientific Reports 2024, checked 2026-05-22: generative AI can automate personalized persuasion by combining psychological-profile inference with message generation."
  - "Love as Bait 2025, checked 2026-05-22: online romance scams often last months or years, use flexible non-linear crime scripts, build dependency, and revisit grooming when victims resist."
  - "2026-05-22 scope-lock note: the user explicitly chose 'AI-mediated harmful interaction trajectory modeling' as the locked framing and narrowed the first task to interaction structure reconstruction, excluding semantics as the initial object."
baseline:
  - "Keyword lists, blacklists, and static scam phrase matching."
  - "A supervised scam/non-scam text classifier trained on yesterday's scripts."
  - "Single-message embedding similarity against known scams."
  - "ASR to transcript to text classifier without modeling transcript uncertainty or downstream decision drift."
  - "Treating persuasion, marketing, legitimate mentorship, and scam as a binary label without influence-gradient or hard-negative review."
  - "Asking an LLM to judge whether a conversation is a scam without reconstructable interaction evidence."
  - "Treating AI safety risk as bad generated content rather than adaptive manipulation of the human decision process."
  - "A detector that flags urgency, authority, or intimacy directly as scam risk without testing hard negatives where those signals are legitimate."
  - "A temporal model that predicts risk but cannot show which turn-level changes made the target less able to verify, pause, challenge, or exit."
  - "Starting with LLM fine-tuning, embedding retrieval, or a scam classifier before defining harmful interaction dynamics."
  - "Treating ASR/NLP engineering as the primary contribution when the real contribution is interaction-system reconstruction."
  - "Jumping directly to broad AI governance instead of using one narrow reconstructable trajectory task."
metrics:
  - "Can the system surface risk from trajectory features before explicit money requests, private-channel migration, or direct scam keywords appear?"
  - "Does the explanation identify concrete dynamics such as authority concentration, urgency compression, isolation escalation, challenge deflection, commitment escalation, and verification suppression?"
  - "Does performance remain useful under paraphrase, language shift, ASR errors, OCR noise, and topic changes?"
  - "Does the system reduce reviewer minutes per useful candidate while preserving hard-negative protection for benign persuasion and legitimate communities?"
  - "Can a human reviewer reconstruct why a trajectory was flagged from turn-level evidence without accepting a black-box label?"
  - "Can the method distinguish influence transparency signals from final fraud determination?"
  - "Does it model longitudinal change across sessions rather than overfitting to one message?"
  - "Does it improve calibration when the right output is watch, ask for context, park, or escalate to human review rather than scam/not-scam?"
  - "Can the method measure decision-autonomy erosion: reduced external verification, increased exit cost, dependence on one authority, and loss of challenge options?"
  - "Do hard-negative cases keep false-positive pressure low when urgency, authority, emotion, or privacy are legitimate?"
  - "Can the trajectory graph identify when risk shifts from ordinary persuasion to autonomy compression before money, credential, privacy, or action extraction?"
  - "Can the method reconstruct interaction phase transitions without reading message semantics?"
  - "Can it identify escalation dynamics from timing, turn-taking, topic transition, question avoidance, channel migration, and dominance patterns?"
  - "Can it model trust-state evolution as a latent state trajectory rather than a single score?"
insights:
  - "The animal-communication analogy is useful because it shows why direct translation may be the wrong first target; functional structure can be observable before literal semantics are known."
  - "For scams, the parallel move is to stop asking only what a message means and ask what the interaction is doing to the target person's options, emotions, verification behavior, and dependency."
  - "The strongest unit is not a token or post but a trajectory: public contact, rapport, channel migration, authority construction, uncertainty reduction, urgency, commitment, and extraction."
  - "Harm can emerge from interaction dynamics even when each isolated message is plausibly benign."
  - "Influence transparency is a better long-term object than binary scam detection because many real systems sit between ordinary persuasion and criminal fraud."
  - "The model does not need full semantic understanding if it can predict and explain risky behavioral outcomes with calibrated uncertainty."
  - "A future AI-mediated scam system may be dangerous because it adapts the manipulation policy in real time, not because it has a better static script."
  - "This connects scam research, ASR brittleness, multimodal grounding, agentic AI governance, and reconstructability into one high-impact interaction-systems frame."
  - "The key question is not only whether the message is false; it is whether the interaction is narrowing the target's ability to make an independent decision."
  - "A temporal interaction graph should represent actors, channels, trust transfer, urgency escalation, private-channel migration, verification suppression, challenge deflection, dependency signals, commitment requests, and extraction attempts."
  - "The research should avoid producing a manipulation playbook. Its safe object is a reviewer-facing evidence schema and influence-transparency rubric."
  - "The user's comparative advantage is the combination of cybercrime, governance, AI systems, reviewer burden, institutional failure, and real-world deployment constraints."
  - "The most dangerous scope failure is trying to do world models, AGI, social governance, scam detection, ASR, NLP, agents, and LLMs all at once."
  - "The near-term paper should be narrow enough to say: we reconstruct interaction structure before semantics."
  - "The larger TFSC-style contribution is institutional: when AI interaction scale exceeds review capacity, reconstructability decays and governance latency becomes a failure mode."
