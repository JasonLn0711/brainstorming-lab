baseline:
- 'AI Operator mode: read papers, write code, run experiments, and maximize short-term
  output without owning a distinctive problem space.'
- 'Model Map mode: follow the newest models, benchmarks, and toolchains as the main
  research compass.'
- 'Baseline race: implement ASR to classification, LLM to triage, or agent to workflow
  without a new evaluation, governance, or theory contribution.'
- 'Paper-volume race: compete primarily on speed and quantity in crowded topics.'
- 'Tool-person PhD: become useful for implementation and demos without building a
  durable research worldview.'
- 'Commodity-AI researcher: use the same models, papers, prompts, datasets, and benchmarks
  as everyone else while expecting execution speed alone to produce distinction.'
- 'Attention-blind publishing: produce technically competent papers that fail to answer
  why anyone should remember the problem.'
- 'Power-following default: assume the only viable path is to attach to the largest
  lab, company, hospital, government office, or funding holder.'
- 'Solo-tool illusion: assume AI democratization alone cancels the advantages of data
  access, institutional trust, distribution, domain relationships, and governance
  authority.'
metrics:
- Number of active projects with an explicit problem-map entry rather than only a
  model or tool plan.
- Percentage of paper ideas that name a technical gap, evaluation gap, institutional
  gap, and theory/framework gap.
- Whether each research line identifies a unique field observation or data-access
  advantage.
- Time spent on problem framing, reviewer-question mapping, and field evidence before
  implementation starts.
- Reduction in projects whose novelty can be summarized as applying a current model
  to a familiar task.
- Number of paper claims that remain meaningful if the model baseline changes.
- 'Quarterly continuity: whether CSL, TFSC, and STV still reinforce one intellectual
  territory.'
- Number of research ideas grounded in direct contact with real workflows, institutions,
  users, or sensitive operational constraints.
- Ability to answer "whose life, work, review burden, or decision quality changes
  if this paper succeeds?"
- 'Homogeneity audit: whether a proposed direction looks like the default output of
  a general AI brainstorming prompt.'
- 'Resource-leverage audit: whether the project depends on data, institutional access,
  compute, distribution, or field trust that generic AI access cannot replace.'
- 'Interface opportunity audit: whether the project lives at a boundary where powerful
  institutions have resources but poor problem understanding.'
insights:
- When execution cost approaches zero, problem choice becomes the main competitive
  bottleneck.
- Research originality can come from evaluation gaps and institutional gaps as much
  as from new algorithms.
- A better metric than "can AI build it?" is "would this problem still matter if every
  competent team could build the baseline?"
- Field-grounded anomalies are harder to imitate than generic technical ideas.
- CEIS, SRES, and Decision Stability are examples of moving from model accuracy to
  decision-quality evaluation.
- Problem Finder and AI Operator are different research roles; the strongest path
  is to use AI operator capacity in service of problem-finder judgment.
- The user's cross-domain field exposure can become a scientific asset when converted
  into explicit problem maps and evaluation frameworks.
- In a saturated market, capability alone is not the moat; position, access, trust,
  and interpretation become the moat.
- The most valuable researcher may be the one closest to real-world failure modes,
  not the one closest to the newest model release.
- Knowledge and idea generation are becoming cheaper; judgment, timing, and field
  contact remain expensive.
- Paper quantity can expand while attention remains fixed, so a paper needs a memorable
  problem, not only a competent implementation.
- AI can诱導 research homogeneity by making many people converge on similar reasonable
  directions; deliberate contact with non-mainstream field evidence is a defense.
- 'AI amplifies leverage more than it simply amplifies power: a person or institution
  with data, trust, workflow access, and capital can convert those assets into output
  faster.'
- M-shaped outcomes become more likely when AI execution is abundant but access to
  real problems, trusted institutions, compute, and distribution remains concentrated.
- The answer is not only to attach to power; another viable strategy is to become
  the trusted interface between AI capability and real-world problem sites.
pain_point_translation:
  surface_question: What should researchers do when AI makes technical capability
    less distinctive?
  deeper_anxiety: Will my years of effort still let me become one of the few people
    whose work matters?
  pain_points:
  - pain: If AI gets stronger, does everything I learned still matter?
    sharper_answer: AI compresses execution gaps, but it does not erase judgment built
      from lived field experience.
    jason_example: Many GPT-capable engineers can build ASR-to-classification, but
      fewer would notice that WER is less important than whether the decision changes.
  - pain: Will I always lose to Stanford, MIT, DeepMind, OpenAI, or Google?
    sharper_answer: You lose if you fight them on model scale, compute, or generic
      benchmarks; you have a different arena when the question requires police experience,
      165 cases, medical workflow, governance, ASR brittleness, and human factors
      together.
    jason_example: OpenAI can be stronger at model capability while still being far
      from Taiwan 165 consultation dynamics or local hospital adoption friction.
  - pain: Is my time going into something that actually matters?
    sharper_answer: The useful question is not whether AI matters, but which problems
      deserve your finite life and attention.
    jason_example: CSL, TFSC, and STV become worth doing only when they answer a high-risk
      decision or governance problem, not just because the technology is current.
  wrong_arena_warning:
  - competing with large labs on foundation-model scale
  - competing with elite universities on institutional prestige alone
  - competing with platform companies on compute and distribution
  - chasing every model, agent framework, MCP surface, and benchmark as if catching
    up were the strategy
  right_arena_candidates:
  - AI failure modes in high-risk decision systems
  - decision-quality evaluation under noisy ASR and weak transcripts
  - cognitive-security and victim-state modeling in 165 consultation contexts
  - governance latency and reconstructability under AI-mediated harmful interaction
  - medical AI staff-review and evidence-interface workflows
  core_sentence: In the AI era, the valuable question is not what technology you can
    use, but what worlds you have seen that others have not seen, and how you convert
    those worlds into problems only you are likely to ask.
