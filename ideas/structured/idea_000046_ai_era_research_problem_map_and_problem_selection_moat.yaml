status: execution_ready
problem_statement:
  raw: In an AI-saturated research environment, technical execution is becoming cheaper
    and faster, like a once-rare market becoming saturated. Researchers need a stronger
    method for choosing original, durable, field-grounded problems rather than only
    building ideas that other teams can quickly reproduce.
  normalized: Given AI tools that can rapidly implement baselines, prototypes, experiments,
    and paper drafts, optimize a researcher problem-selection system that finds durable,
    original, field-grounded, and publishable problem spaces under constraints of
    idea commoditization, paper-volume inflation, model/tool churn, limited unique
    data access, attention scarcity, AI-induced idea homogeneity, competition from
    AI operators, and the need to build a defensible long-term research identity.
  structure:
    given: AI-assisted research execution where many technically plausible ideas can
      be implemented quickly by many teams
    optimize: durable problem selection, insight generation, synthesis, and research
      identity formation
    constraints:
    - execution cost is falling
    - obvious ideas are quickly copied or rediscovered
    - paper volume is increasing
    - model and tooling maps change quickly
    - unique field experience and data access are scarce
    - audience attention does not scale with paper volume
    - AI may steer many researchers toward similar plausible ideas
    - publishability depends on novelty, evidence, framing, and timing
summary: 'The AI-era research bottleneck is moving from "can we build it?" to "is
  this the right problem, and does our framing reveal something durable?" The apple-market
  analogy is useful: when a once-rare capability becomes widely available, value moves
  from simple access to position, differentiation, distribution, trust, and judgment.
  When AI makes coding, baselines, and draft production easier, the scarce research
  assets become problem selection, insight generation, cross-domain synthesis, unique
  data access, theory construction, reality access, attention capture, and field-grounded
  judgment. The user''s strongest moat is not generic AI execution; it is the unusual
  combination of police/165 antifraud practice, medical AI workflow exposure, cybersecurity
  governance, AI agent systems, ASR brittleness, and human-factors thinking. The next
  research OS should prioritize a problem map over a model map.'
source_note_zh: 這次想法的核心是：AI 讓 execution 變快以後，研究者真正稀缺的能力會轉向 problem selection、 insight
  generation、synthesis、unique data access、framework building。Jason 的優勢不是比 AI 更會寫 code，
  而是比一般 AI operator 更知道哪些真實場域的問題值得做，尤其是警政、165 詐欺、醫療 AI、資安治理、AI Agent、 ASR、人因工程交會處。
first_principle:
  scarce_resource: original problem selection under cheap execution
  core_question: When AI makes implementation abundant, how can a researcher choose
    problems that remain distinctive, durable, and evidence-grounded?
  not_the_core:
  - racing to implement every new model baseline
  - measuring research value only by paper count
  - treating AI as a productivity tool without changing problem selection
  - chasing model maps that refresh every few months
  - assuming difficulty of coding is the main source of research novelty
  - assuming creativity alone remains scarce when AI can generate many plausible ideas
  reusable_rule: Build a Problem Map before a Model Map; durable research identity
    comes from the field-grounded problems, evaluation gaps, institutional gaps, and
    theory gaps that survive model churn.
  smallest_next_test: Create a one-page problem map for CSL, TFSC, and STV that lists
    each line's field observation, overlooked evaluation gap, institutional gap, civilization-level
    question, unique evidence source, and next falsifiable test.
  kill_condition: Park the framework if it only produces abstract slogans and does
    not change project selection, paper framing, or next experiment choice.
assumptions:
- AI tools reduce the execution advantage of simply building baselines, prototypes,
  and standard model pipelines.
- Obvious technical gaps become crowded faster when many researchers use similar AI
  systems and prompt patterns.
- Researcher advantage increasingly comes from problem definition, insight, synthesis,
  field access, and theory construction.
- Unique field experience can create better problem selection than model familiarity
  alone.
- The user's police, 165 antifraud, medical workflow, cybersecurity, ASR, agent, and
  human-factors exposure can become a defensible research moat.
- A long-lived problem map can guide multiple papers better than a rapidly changing
  model map.
- Once AI skills become commodity capabilities, position in real-world systems becomes
  more valuable than generic technical fluency.
- Paper volume can rise faster than reviewer or field attention, so memorable problem
  framing becomes part of research value.
- Creativity is also becoming cheaper; judgment about which idea deserves years of
  work remains scarce.
- AI systems may induce convergence by suggesting similar plausible research directions
  to many teams.
- AI can simultaneously democratize individual execution and centralize advantage
  around organizations with data, capital, compute, distribution, and institutional
  access.
- Resource-rich actors gain compounding leverage because AI turns existing data, staff,
  trust, and partnerships into more output per unit of human labor.
- The strategic response is not only to move toward power; it can also be to move
  toward field sites and interfaces where powerful actors still lack problem understanding.
