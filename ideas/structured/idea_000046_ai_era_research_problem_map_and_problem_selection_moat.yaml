problem_gap_ladder:
- level: technical_gap
  description: A model, pipeline, or system is not fast, accurate, robust, or cheap
    enough.
  ai_era_risk: Easy to crowd because AI helps many teams implement the same fix.
  example: ASR is not accurate enough.
- level: evaluation_gap
  description: The field is optimizing the wrong metric or missing a decision-relevant
    failure mode.
  ai_era_risk: Harder to notice because it requires judgment about what matters.
  example: WER does not equal decision quality; CEIS, SRES, and Decision Stability
    measure which errors change downstream action.
- level: institutional_gap
  description: The technical system interacts with review capacity, governance latency,
    accountability, or organizational workflow.
  ai_era_risk: Requires field understanding and cannot be solved by model upgrades
    alone.
  example: AI-mediated scams scale faster than institutional review and reconstructability.
- level: civilization_gap
  description: AI changes knowledge production, democracy, markets, science, or social
    trust at system level.
  ai_era_risk: Easy to overclaim; requires careful scope, evidence, and theory.
  example: AI may homogenize scientific creativity when many researchers use similar
    models.
researcher_archetypes:
- archetype: AI Operator
  strength: Uses AI to read, code, test, write, and produce many outputs quickly.
  risk: High output can become forgettable if it lacks a distinctive problem frame.
  best_use: Execute baselines, run fixtures, prepare evidence, and compress literature
    after the problem is selected.
- archetype: Problem Finder
  strength: Identifies overlooked, durable, field-grounded, and theory-shaping problems.
  risk: May underproduce without a disciplined execution pipeline.
  best_use: Choose the problem map, define contribution, protect scope, and decide
    which AI execution is worth using.
