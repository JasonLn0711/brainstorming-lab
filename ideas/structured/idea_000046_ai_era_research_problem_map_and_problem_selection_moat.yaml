market_analogy:
  object: Taiwan apple market as analogy for AI research capability commoditization
  scarcity_phase: When import access or technical ability is rare, value comes from
    being able to supply the capability at all.
  saturation_phase: When supply expands, simple access becomes less distinctive and
    value moves to position, quality, trust, distribution, brand, timing, and differentiated
    use case.
  research_translation: When many researchers can build LLM, RAG, agent, ASR, and
    baseline systems, value shifts toward reality access, original problem definition,
    judgment, theory, evaluation gaps, and institutional trust.
ai_dual_force:
  democratization:
  - individual researchers can code, analyze, write, translate, summarize, and prototype
    with fewer support staff
  - small teams can reach baseline capability that previously required larger labs
  - language and programming barriers are lowered
  centralization:
  - organizations with proprietary data can extract more value from existing assets
  - institutions with compute, capital, distribution, and compliance capacity can
    operationalize AI faster
  - trusted access to hospitals, police systems, courts, finance, and government workflows
    remains scarce
  implication: AI creates both single-person leverage and resource-compounding leverage;
    the research moat comes from choosing which scarce complement to own.
three_positioning_paths:
- path: close_to_power
  examples:
  - large AI labs
  - major hospitals
  - government research institutes
  - large platform companies
  advantage: data, compute, funding, brand, distribution, and formal authority
  risk: agenda capture and becoming an implementer inside someone else's problem map
- path: close_to_field
  examples:
  - fraud investigation
  - medical intake workflow
  - legal practice
  - long-term care
  - manufacturing operations
  advantage: direct access to real failure modes and overlooked evaluation gaps
  risk: slower publication path and higher coordination burden
- path: close_to_interface
  examples:
  - AI and medical workflow
  - AI and law enforcement review
  - AI and financial compliance
  - AI and governance
  - AI and human factors
  advantage: knowledge discontinuities where technical people and domain institutions
    need translation
  risk: requires bilingual competence across technical, institutional, and human workflow
    languages
missing_dimensions_to_add:
- dimension: reality_access
  why_it_matters: Many researchers know arXiv, Hugging Face, and GitHub, but fewer
    have sustained access to patients, fraud victims, nurses, police workflows, legal
    institutions, compliance teams, or operational review settings.
  working_rule: Spend deliberate time near the real workflow before choosing the model.
- dimension: attention_scarcity
  why_it_matters: Paper count can grow quickly, but reviewer, reader, and field attention
    remain scarce.
  working_rule: A paper should answer who remembers the problem and whose decision
    changes if the claim is true.
- dimension: judgment_over_creativity
  why_it_matters: AI can generate many ideas, but selecting the idea worth three to
    five years requires experience, taste, and field evidence.
  working_rule: Treat idea generation as cheap and idea selection as expensive.
- dimension: anti_homogeneity
  why_it_matters: AI may guide many researchers toward similar plausible framings,
    baselines, and paper structures.
  working_rule: Use field observation, contradiction logs, and non-mainstream evidence
    to escape default AI-generated research directions.
- dimension: relationship_and_trust
  why_it_matters: Access to high-value real-world problems often depends on trusted
    relationships, governance discipline, and careful handling of sensitive contexts.
  working_rule: Build reputation as someone who can protect boundaries while extracting
    reusable research insight.
paper_line_implications:
- line: CSL
  problem_map_role: Connects language, safety, and cross-lingual blind spots as an
    evaluation and governance gap rather than only prompt attack collection.
- line: TFSC
  problem_map_role: Studies institutional capacity, reconstructability, and governance
    stress under scaled AI-mediated interaction.
- line: STV
  problem_map_role: Treats ASR and speech understanding as decision-stability problems
    where transcript error matters only through downstream human or system action.
pressure_tests:
- name: Problem map before model map
  setting: A new paper idea appears attractive because a current model can implement
    the pipeline quickly.
  expected_failure_mode: The project becomes an obvious AI-assisted application with
    weak novelty and no durable problem claim.
  smallest_observable_test: Fill one page with technical gap, evaluation gap, institutional
    gap, theory gap, unique field evidence, baseline crowding risk, and ten-year relevance
    before writing code.
  metric_or_decision: Continue only if at least one non-obvious evaluation, institutional,
    or theory gap remains valuable after model churn.
- name: AI homogeneity research question test
  setting: Many teams use similar foundation models to brainstorm, code, and write
    papers.
  expected_failure_mode: Research creativity appears to accelerate but actually converges
    toward similar problem framings, baselines, and claims.
  smallest_observable_test: Compare recent papers or project proposals in one niche
    for repeated problem statements, metrics, and AI-assisted implementation patterns.
  metric_or_decision: Promote to a Research Policy or Scientometrics idea only if
    there is observable convergence beyond normal literature influence.
- name: Field-grounded moat audit
  setting: The user chooses between a generic model paper and a field-grounded problem
    from police, 165, medical, cybersecurity, ASR, or human-factors exposure.
  expected_failure_mode: The generic model paper feels easier and faster, but lacks
    defensible originality.
  smallest_observable_test: Score both options on unique evidence access, overlooked
    failure mode, reviewer memory, ten-year relevance, and ability to survive baseline
    replacement.
  metric_or_decision: Prefer the field-grounded line if it has stronger reviewer memory
    and a more durable evaluation or governance gap.
- name: Saturated-market positioning audit
  setting: The user is tempted to define themselves as an AI researcher in a crowded
    market.
  expected_failure_mode: The identity competes directly with thousands of researchers
    using similar models and tools.
  smallest_observable_test: 'Rewrite the positioning statement three ways: generic
    AI researcher, high-risk decision-systems researcher, and AI-governance interface
    researcher; test which one better explains CSL, TFSC, STV, 165, medical AI, and
    Rich UI work together.'
  metric_or_decision: Prefer the positioning that unifies the user's field access,
    evaluation gaps, and institutional questions instead of only listing AI skills.
- name: Reality-contact quota
  setting: A quarter of research work risks being dominated by papers, models, and
    code without field contact.
  expected_failure_mode: The research map drifts toward generic AI trends and loses
    the user's moat.
  smallest_observable_test: 'For each active line, record one direct or proxy contact
    with real workflow evidence: meeting, interview, observation, artifact, case,
    log, review session, or domain expert critique.'
  metric_or_decision: Keep investing only if the line can name the real workflow signal
    that generic AI researchers would likely miss.
