ui_observation_template:
  layout:
  - overall composition
  - grid or stack model
  - content width and canvas ratio
  - card and section structure
  visual_hierarchy:
  - first visual focus
  - second visual focus
  - primary action
  - secondary information
  spacing:
  - spacing scale
  - card padding
  - section gap
  - icon-to-text gap
  - line height
  color_roles:
  - trust color
  - warning color
  - success color
  - neutral information color
  - background anxiety-reduction color
  information_density:
  - grouping strategy
  - wording limit
  - icon support
  - whitespace strategy
  cognitive_load:
  - target user mental state
  - panic reducers
  - avoid-list
  - accessibility and readability
  ai_prompt_contract:
  - canvas and responsive constraints
  - layout system
  - semantic tokens
  - states and interactions
  - verification checklist
prompt_pattern:
  bad_prompt: Make a beautiful medical dashboard.
  good_prompt: Build a low-cognitive-load medical summary page with a card-based layout,
    4:3 fixed canvas, 8pt spacing system, calm and trustworthy style, primary focus
    on heart-rate alert, secondary vital-sign cards, semantic colors for warning,
    safe, neutral, and trust roles, clear grouping, elderly-readable typography, no
    high-saturation red, no excessive animation, and no crowded clinical wording.
next_steps:
- Create `docs/ui-reverse-engineering-framework.md` as the reusable observation template
  and prompt contract.
- Apply the template to one concrete medical UI screenshot or mockup and write the
  resulting AI implementation prompt.
- Build one tiny static HTML prototype from the prompt and compare the rendered layout
  against the observation spec.
- 'Add a checklist for Codex: inspect screenshot, write spec, implement, screenshot-test,
  revise spacing/hierarchy, then commit.'
