pressure_test:
  setting: A first-time visitor using a narrow phone screen needs to find one research
    contribution and one project evidence link.
  expected_failure: Overlapping labels, panels or camera motion hide content and delay
    reading.
  smallest_test: After separate implementation activation, compare the same two retrieval
    tasks in the text list and three-island slice.
  decision: Keep 3D optional; simplify or park it if users cannot complete the tasks
    or device budgets fail.
