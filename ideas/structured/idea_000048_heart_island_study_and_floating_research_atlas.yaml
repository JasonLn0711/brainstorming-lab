status: structured
problem_statement:
  raw: Jason wants a detailed study of HEART Island and a personal floating-island
    site, with a Notion/Kairos-inspired readable homepage.
  normalized: Given an existing public SvelteKit portfolio and visitors with limited
    attention, optimize evidence-backed discovery through a readable homepage and
    optional floating-island view under constraints of mobile performance, accessibility,
    public-only content and low maintenance.
  structure:
    given: an existing public SvelteKit portfolio and visitors with limited attention
    optimize: evidence-backed discovery through a readable homepage and optional floating-island
      view
    constraints:
    - mobile performance
    - accessibility
    - public-only content
    - low maintenance
summary: 已完成原站公開前端分析與個人懸浮六島設計筆記；採首頁閱讀入口加 /islands/，網站實作與發布尚未啟動。
assumptions:
- Six thematic islands may improve orientation; this is not yet a measured usability
  result.
- The existing public content can supply initial exhibits after freshness review.
evidence:
- 2026-10-22 user selected personal research islands, fantasy miniature floating islands,
  and a teaching-plus-engineering note structure.
- 'Public source snapshot hashes and ID-reference checks: ideas/2026-10-22-heart-island-floating-research-atlas/source-manifest.json'
- 'Browser observation: traffic topic, school-zone detail, F6 relation and YouBike
  search; desktop and 390x844 viewport.'
- Existing website package and content inspected; no website build or code change
  performed.
baseline:
- Current text-first portfolio homepage and direct research/project/teaching links.
metrics:
- Visitor can reach a public work detail through either text or 3D without losing
  contribution/status context.
- Frame-time and lifecycle budgets are defined in the engineering spec and remain
  unmeasured.
insights:
- A single public content source should drive both readable lists and spatial exhibits.
- Floating parent groups require anchors, labels and routes to share a consistent
  transform.
