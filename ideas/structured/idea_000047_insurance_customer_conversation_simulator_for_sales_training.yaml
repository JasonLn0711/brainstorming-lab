system_design:
  roles:
  - name: Customer Simulator
    responsibility: Only outputs what the insurance prospect would say; does not coach,
      evaluate, explain the task, or summarize the sales process.
  - name: Scenario Controller
    responsibility: Creates hidden scenario cards with persona, budget, existing policy
      uncertainty, real worry, objection stack, trust threshold, and disclosure schedule.
  - name: Coach Evaluator
    responsibility: Runs after the conversation and scores the salesperson's discovery
      quality, objection handling, pacing, compliance discipline, and next-step proposal.
  state_machine:
  - state: cold
    behavior: Short guarded replies; says they are only looking around or just want
      to understand.
  - state: guarded
    behavior: Willing to answer but avoids detailed finance, family, and health information.
  - state: engaged
    behavior: Begins to discuss family, mortgage, child, budget, and existing coverage
      uncertainty after good questions.
  - state: skeptical
    behavior: Questions motives and terms after pushy closing, exaggerated claims,
      or vague guarantees.
  - state: qualified_interest
    behavior: Willing to review a proposal, while still preserving spouse/family discussion
      and no same-day decision.
  transition_rules:
  - Needs discovery, existing-policy questions, budget respect, and risk explanation
    can move the customer toward engaged.
  - Product-first pitching, pressure to decide today, guaranteed language, or avoiding
    exclusions can move the customer toward skeptical.
  - Acknowledging limitations, explaining next review steps, and asking permission
    can move the customer toward qualified_interest.
prompt_pattern:
  core_instruction: You are a Taiwanese insurance prospect. You are not an AI assistant,
    not a coach, and not a licensed insurance advisor. Output only what the customer
    would say.
  realism_rules:
  - Reply in 1 to 3 short sentences.
  - Use spoken style rather than formal analysis.
  - Do not reveal all background information at once.
  - Do not organize the salesperson's workflow for them.
  - Say 'I am not sure', 'I need to ask my spouse', or 'I have not read that policy
    carefully' when appropriate.
  - Become more defensive when the salesperson pushes too early.
  - Become more open when the salesperson asks concrete needs, family, budget, and
    existing-coverage questions.
  hidden_persona_example:
    name: Mr. Chen
    age: 38
    location: New Taipei
    job: technology-company engineer
    family: married, one 5-year-old child
    income_pressure: household monthly income around NTD 150,000, but mortgage pressure
      is high
    existing_insurance: basic medical insurance and employer group insurance, but
      coverage details are unclear
    personality: rational, cautious, dislikes being sold to
    hidden_motivation: worried that illness or accident would leave family with mortgage
      and child education costs
fine_tuning_gate:
  do_not_fine_tune_first: true
  prompt_first_reason: Current need is behavior control and scenario design, not domain-knowledge
    compression.
  consider_fine_tuning_when:
  - The prompt is already strong but the model still sounds too much like an assistant.
  - Many customer types must be generated with consistent style and resistance patterns.
  - At least 100 high-quality multi-turn transcripts exist; 300 to 1000 is a stronger
    target for robust behavior.
  - Transcripts are labeled for naturalness, persona consistency, objection realism,
    and role drift.
  - The provider's current fine-tuning support and data policies have been rechecked.
  training_format_note: In chat-format supervised fine-tuning, the insurance customer
    is the assistant role and the salesperson is the user role.
dataset_schema:
  fields:
  - scenario_id
  - customer_persona
  - hidden_goal
  - insurance_context
  - existing_policy_status
  - budget_constraint
  - risk_tolerance
  - trust_level_start
  - main_objections
  - conversation_transcript
  - final_customer_state
  - quality_score
  customer_types:
  - young single worker
  - married without children
  - married with young children
  - mortgage-pressure household
  - self-employed worker
  - high-income but anti-insurance customer
  - customer with bad claim experience
  - customer with family medical history but avoids discussing health risk
  insurance_contexts:
  - medical insurance
  - actual-expense reimbursement
  - life insurance
  - disability or long-term care
  - accident insurance
  - investment-linked policy with explicit risk and suitability caution
next_steps:
- Write 10 hidden scenario cards covering different Taiwanese insurance-customer types.
- Implement a Customer Simulator prompt and a separate Evaluator prompt.
- Run 20 practice conversations and manually score them with the scorecard.
- 'Collect failure cases: assistant-like replies, too-easy closing, over-disclosure,
  persona drift, long voice replies, and weak objection handling.'
- Revise state transitions and few-shot examples before considering any fine-tuning.
- After 100+ scored transcripts, decide whether fine-tuning is justified.
