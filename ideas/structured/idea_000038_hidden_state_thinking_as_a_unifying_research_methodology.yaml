pressure_test:
  setting: A 165 antifraud call-center research prototype receives audio, transcript,
    timing, caller metadata, and escalation logs from a citizen who may be entering
    scam control.
  expected_failure_mode: The system collapses the problem into transcript classification
    and misses the caller's cognitive-state transition, timing, hesitation, resistance,
    uncertainty, or recovery window.
  smallest_observable_test: Annotate 10 short call segments with observable variables,
    hypothesized hidden state, transition direction, evidence strength, alternative
    explanations, and what would change the human intervention decision.
  confirm_revise_or_kill_metric: Keep the methodology if it helps reviewers explain
    state transitions and intervention timing better than a static scam/not-scam label.
