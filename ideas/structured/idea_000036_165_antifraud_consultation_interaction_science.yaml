paper_framework:
  working_title: "AI-based interaction representation for cognitive vulnerability dynamics in anti-fraud hotline conversations"
  paper_identity: "interaction-centered cognitive vulnerability modeling"
  advisor_alignment: "Follow Rao teacher's lesson by defining the single smallest valid core problem before adding tools, systems, or governance expansion."
  one_sentence_claim: "This paper shows that manipulated cognitive-state dynamics can be studied within help-seeking anti-fraud hotline conversations by proposing an interaction-centered representation framework and validating it through restricted pilot annotation, trajectory analysis, selection-boundary and reversible-window analysis, and public-safe synthetic exemplars."
  central_reviewer_memory: "The stable signal is not the scam script itself, but the interaction dynamics and cognitive vulnerability patterns shown by manipulated or uncertain callers who still seek institutional verification."
  only_core_problem: "How can AI represent cognitive vulnerability dynamics from acoustic, conversational, and intervention signals in help-seeking anti-fraud hotline interactions without relying on scammer audio, brittle content labels, or claims about all victims?"
  main_method: "A multilayer interaction representation framework that reconstructs acoustic dynamics, interaction structure, cognitive vulnerability states, and officer intervention timing as a temporal trajectory."
  main_evidence_stack:
    - "restricted 10-call pilot annotation packet, or synthetic exemplar calls before real-data approval"
    - "human-readable codebook for caller state, officer action, phase transition, repair failure, and outcome state"
    - "trajectory maps showing phase transitions, information-gain moments, closure, resistance, and intervention timing"
    - "selection-boundary analysis explaining who is visible to 165 and who may be missing"
    - "reversible-window analysis distinguishing intervention timing from moral worth"
    - "exploratory acoustic and turn-taking feature summaries"
    - "public-safe synthetic examples and aggregate metrics"
  main_contribution_sentence: "We define an interaction-centered representation framework for modeling cognitive vulnerability dynamics in help-seeking anti-fraud hotline conversations, separating manipulation aftermath signals from scam content detection while making the population-selection boundary explicit."
  novelty_is_not:
    - "a higher-accuracy scam classifier"
    - "a new ASR system"
    - "a chatbot or anti-fraud assistant"
    - "a multimodal LLM demo"
    - "a universal AI-governance theory"
  novelty_is:
    - "reframing victim-side hotline audio as cognitive-state and interaction-trajectory data"
    - "operationalizing cognitive vulnerability as observable acoustic and interaction signals"
    - "separating representation discovery from premature binary scam labels"
    - "linking officer intervention timing to state transition rather than treating officers as transcript background"
    - "showing a public-safe evidence architecture for sensitive institutional speech data"
    - "turning help-seeking selection bias into an explicit institutional-intervention boundary"
    - "treating help-seeking itself as a measurable cognitive-security signal without making human-worth claims"
  abstract_contract:
    problem: "Real-world fraud evolves quickly across scripts, domains, and languages, making content-level scam detection brittle."
    gap: "Most anti-fraud modeling focuses on scam content or binary labels, while the help-seeking victim-side cognitive and interaction state after manipulation remains under-modeled and often confused with all-victim representation."
    method: "The paper proposes an interaction-centered representation framework over acoustic dynamics, interaction structure, cognitive vulnerability signals, and institutional intervention."
    result: "The initial evidence should show whether restricted pilot annotation, selection-boundary analysis, reversible-window analysis, and trajectory reconstruction can expose stable vulnerability, repair-failure, and intervention patterns without raw-data release."
    contribution_boundary: "The contribution is a framework and restricted diagnostic protocol, not a production detector, legal judgment system, or public raw-audio dataset."
  section_plan:
    section_1_introduction:
      purpose: "Establish the real-world problem: scams mutate, AI can personalize persuasion, and token-level detection becomes brittle."
      key_move: "Introduce the punchline that stable signals may lie in interaction dynamics after manipulation, not in scam scripts."
    section_2_problem_reframing:
      purpose: "Declare that the paper is not scam content detection but cognitive-state-oriented interaction modeling."
      key_move: "Explain token-centric limits, semantic drift, ASR brittleness, multilingual instability, uncertain labels, and help-seeking selection bias."
    section_3_theoretical_perspective:
      purpose: "Justify why interaction patterns are meaningful without becoming a psychology paper."
      key_move: "Use cognitive overload, bounded rationality, manipulation dynamics, help-seeking as adaptive coping, conversational asymmetry, and institutional intervention as supporting lenses."
    section_4_dataset_and_representation_design:
      purpose: "Describe the 165 hotline corpus as restricted high-value help-seeking interaction data and define the representation layers."
      key_move: "Separate acoustic dynamics, interaction structure, cognitive vulnerability signals, officer intervention, and population-selection boundary."
    section_5_representation_learning:
      purpose: "Explain why reliable labels are hard and why self-supervised or weakly supervised representation discovery is appropriate."
      key_move: "Use trajectory embedding, clustering, contrastive or predictive objectives, and human-readable codebook comparison as analysis tools."
    section_6_interaction_trajectory_analysis:
      purpose: "Analyze manipulation as temporal evolution rather than sentence classification."
      key_move: "Map panic increase, uncertainty persistence, closure, stabilizing intervention, repair failure, and resistance trajectories."
    section_7_institutional_implications:
      purpose: "Connect the result to cognitive-security systems, review scarcity, hotline triage, and institutional overload."
      key_move: "Frame this as cognitive-security triage and intervention timing, not as moral ranking of who is worth protecting."
    section_8_limitations:
      purpose: "Protect claim discipline."
      key_move: "State that the data is not direct scammer-victim interaction, labels are uncertain, callers are a selected help-seeking population, the most isolated victims may be missing, sampling is institutional, and ethics restrict release."
  concrete_method_sequence:
    - "Step 0: Write the one-page paper contract with the one-sentence claim, not-this-paper list, and contribution-to-evidence map."
    - "Step 1: Build the ethics and data-governance protocol before touching raw audio."
    - "Step 2: Create a codebook for caller cognitive state, officer intervention, acoustic marker, repair failure, phase transition, and outcome state."
    - "Step 3: Define the help-seeking population boundary: who can appear in 165 calls, who is likely missing, and what claims are therefore invalid."
    - "Step 4: Define the moral framing guardrail: intervention effectiveness is not human worth, and non-help-seeking is not unprotectability."
    - "Step 5: Run a 10-call restricted pilot, or synthetic exemplar calls if real-data approval is not ready."
    - "Step 6: Segment each call by turn, 30-second window, topic shift, or phase transition."
    - "Step 7: Annotate observable interaction traits without assigning medical, legal, deception, final scam truth, or moral worth."
    - "Step 8: Extract acoustic and turn-taking features that do not require raw public release."
    - "Step 9: Construct temporal interaction graphs and trajectory summaries."
    - "Step 10: Explore self-supervised or weakly supervised trajectory embeddings and clustering as secondary analysis, not the paper's conceptual center."
    - "Step 11: Validate with inter-coder agreement, qualitative trajectory audit, selection-boundary audit, reversible-window audit, synthetic examples, and aggregate statistics."
    - "Step 12: Write institutional implications only after the representation framework and evidence chain are clear."
  reviewer_question_list:
    - "What exactly is cognitive vulnerability in this paper, and how is it operationalized without overclaiming psychology?"
    - "Why can a study without scammer audio still contribute to anti-fraud research?"
    - "Why is this not just speech emotion recognition, ASR, or scam classification?"
    - "How can the paper validate cognitive-state dynamics without clean ground-truth scam labels?"
    - "Who is visible in 165 hotline data, who is missing, and how does selection bias limit the claims?"
    - "How does the paper avoid implying that non-help-seeking people are less worthy of protection?"
    - "What is the reversible intervention window, and how is it observed without overclaiming?"
    - "How are privacy, voice biometrics, institutional sensitivity, and public reproducibility handled?"
    - "What evidence shows that interaction dynamics are more stable or useful than content alone?"
    - "What is the boundary between AI-assisted analysis and automated judgment?"
