historical_scope_before_2026_11_16:
  next_steps:
  - Rewrite the one-page problem definition around victim cognitive-state modeling
    and AI for cognitive security, not scammer audio or scam classification.
  - 'Add the help-seeking population boundary to the one-page paper contract: 165
    callers are not all scam victims, but a selected institutional verification population.'
  - 'Draft the cognitive-state codebook: confusion, panic, dependency, suggestibility,
    emotional overload, verification resistance, authority overtrust, rationalization,
    attention narrowing, and emotional oscillation.'
  - 'Define the four-layer representation: acoustic layer, interaction dynamics, cognitive
    state modeling, and institutional response.'
  - Design a 10-call restricted pilot annotation packet; if real access is not approved,
    build synthetic exemplar calls first.
  - 'Define which artifacts are allowed in git: schema, aggregate metrics, synthetic
    examples, and redacted methods only.'
  - Use latent structure discovery before any binary label or predictive model.
  pressure_test:
    setting: A restricted pilot using 10 authorized 165 consultation calls sampled
      across not-yet-paid, already-paid, successfully-stopped, unresolved, and high-anxiety
      cases.
    expected_failure_mode: The work collapses into ASR cleanup, call-level labels,
      or overgeneralized victim claims, or creates privacy risk by storing transcripts
      and voice-derived identifiers in the wrong place.
    smallest_observable_test: Create a redacted annotation packet that segments each
      call into turns or 30-second windows, labels cognitive state, officer action,
      interaction dynamics, acoustic markers, information-gain moments, repair failure,
      outcome state, and selection-boundary notes, then publishes only aggregate schema
      plus synthetic exemplars.
    decision_metric: Pass if two reviewers can apply the codebook consistently, latent
      patterns emerge without forcing scam/not-scam labels, intervention timing becomes
      visible, selection bias is explicitly bounded, and no raw audio/transcript or
      identifying detail enters git.
  smallest_useful_unit: a restricted 10-call pilot annotation packet focused on cognitive
    state, acoustic markers, interaction dynamics, officer intervention, and public-safe
    synthetic exemplars.
  paper_framework: 原 paper_framework 已保留於 historical_paper_framework；不是本次主要分析契約。
  baseline:
  - Treat the 30 hours as an ASR dataset and report transcript word error rate.
  - Treat the data as a speech emotion classification dataset.
  - Fine-tune a BERT, Whisper, or LLM pipeline for scam/not-scam labels.
  - Build an accuracy leaderboard that ignores interaction structure, intervention
    timing, and institutional capacity.
  - Use full transcripts as public evidence without a de-identification and release
    protocol.
  - Analyze only citizen language and ignore officer questioning strategy and institutional
    triage constraints.
  - Assume text semantics is enough and discard acoustic hesitation, silence, overlap,
    speaking rate, and stress markers.
  - Assume antifraud modeling requires scammer voice and therefore undervalue victim-side
    cognitive-state data.
  - Force early binary ground truth even though the hotline population mixes true
    victims, anxious callers, suspicious callers, delusional cases, and normal consultation.
  - Convert speech to text and train a classifier while losing dialect, hesitation,
    fragmented speech, overlap, emotional speech, pauses, and turn-taking.
  - Treat 165 callers as representative of all scam victims or all manipulated people.
  - Hide selection bias in a limitation paragraph instead of using it to define the
    actual study population.
  - Frame non-help-seeking people as not worth protecting.
  - Confuse intervention effectiveness with human worth or protectability.
  - Use cognitive-security triage as moral triage rather than timing and resource-allocation
    analysis.
  metrics:
  - Can a codebook identify interaction states such as initial suspicion, trust in
    scammer, uncertainty, reassurance seeking, panic, rationalization, information
    disclosure, officer trust, and intervention acceptance?
  - Can interaction state transitions be reconstructed by turn, time window, or topic
    shift without relying only on scam keywords?
  - Which officer question types produce sudden information gain, clarification, shutdown,
    resistance, or trust transfer?
  - Do acoustic markers such as hesitation, silence duration, speaking rate, pitch
    instability, interruption, overlap, and stress burst correlate with high-risk
    or deep-manipulation states?
  - Can trajectories distinguish already-paid, not-yet-paid, successfully-stopped,
    and unresolved consultation outcomes?
  - Can the method estimate officer review burden, triage bottlenecks, escalation
    delay, and capacity threshold under higher call volume?
  - Can public outputs remain useful while exposing only aggregate metrics, codebooks,
    synthetic exemplars, and redacted protocols?
  - Can the method model cognitive vulnerability levels such as confusion, panic,
    dependency, suggestibility, emotional overload, and verification resistance?
  - Can latent structure discovery reveal stable cognitive-state clusters without
    forcing scam/not-scam labels?
  - Can acoustic precursors of panic, overload, or verification resistance be detected
    before the transcript clearly states risk?
  - Can conversation repair failure be quantified through repeated questions, unresolved
    topics, fixation, and failed alternative explanations?
  - Can effective officer intervention patterns be identified through changes in caller
    uncertainty, grounding, information disclosure, and action readiness?
  - Can the study characterize the help-seeking population separately from non-calling,
    isolated, or fully captured victims?
  - 'Can help-seeking behavior itself be modeled as an interaction signal: willingness
    to verify, remaining doubt, institutional trust, or partial escape from isolation?'
  - Can the study distinguish intervention feasibility, institutional resource allocation,
    and human worth in the research framing?
  - Can the study identify a reversible intervention window where cognitive capture
    is not complete and external verification still works?
  - Can help-seeking thresholds be operationalized through uncertainty, verification
    seeking, trust displacement, and willingness to accept institutional contact?
  scope_note: 未明示更新的舊 assumptions／insights／evidence／paper 細節保留歷史；現行主分析以 current_scope_2026_11_16
    與本次 companion 為準。
