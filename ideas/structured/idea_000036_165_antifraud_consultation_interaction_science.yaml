      - "The study analyzes the institutional intervention boundary where people contact an anti-fraud hotline."
      - "The study can compare trajectories within the help-seeking population."
    unsafe:
      - "The study represents all scam victims."
      - "The study captures the most deeply manipulated or isolated victims."
      - "The study estimates population prevalence of cognitive vulnerability."
      - "The study proves how non-callers behave."
  paper_value: "This limitation can become part of the contribution because it clarifies that hotline data studies institutional verification interactions, not the full victim universe."
intervention_boundary_framework:
  core_question: "Under finite institutional resources, which interaction stages and intervention boundaries are most effective for changing a harmful trajectory?"
  keep_separate:
    intervention_effectiveness: "Whether a specific intervention can still change the cognitive or behavioral trajectory at a given stage."
    institutional_resource_allocation: "How scarce officer attention, time, escalation capacity, and review infrastructure should be deployed."
    human_worth_or_protectability: "Never a model output, ranking target, or research claim."
  moral_framing_guardrail:
    safe_language:
      - "intervention timing"
      - "intervention feasibility"
      - "institutional resource allocation"
      - "help-seeking threshold"
      - "reversible window"
      - "cognitive-state transition"
      - "cognitive-security triage"
    unsafe_language:
      - "not worth protecting"
      - "too gullible to save"
      - "unprotectable people"
      - "low-value victims"
      - "moral deservingness"
  reversible_window_hypothesis:
    definition: "A stage in which cognitive capture is not complete and the person still shows uncertainty, verification seeking, or openness to institutional reality-checking."
    observable_signals:
      - "caller initiates or accepts external verification"
      - "caller expresses doubt or oscillates between scammer and officer frames"
      - "caller can still answer grounding or timeline-reconstruction questions"
      - "caller can temporarily suspend scammer authority"
      - "caller shows trust displacement from suspicious actor toward institutional actor"
      - "caller can translate officer explanation into action readiness"
    caution: "Absence of these signals in 165 data does not prove a person is unreachable; it may reflect that the person is outside this institutional observation channel."
  help_seeking_as_signal:
    interpretation: "Help-seeking itself may indicate adaptive coping, uncertainty recognition, residual institutional trust, cognitive openness, and remaining external verification capacity."
    use_in_paper: "Treat help-seeking as an observable cognitive-security signal at the institutional interface, not as a moral quality."
  cognitive_security_triage:
    meaning: "Prioritize intervention timing and support routes under scarcity."
    not_meaning: "Do not rank human worth, deservingness, or legal victim status."
  literature_anchors:
    - source: "Rickwood, Thomas, and Bradford / Sax Institute Evidence Check on help-seeking measures in mental health"
      relevance: "Supports help-seeking as an adaptive coping process involving external assistance for a concern."
    - source: "Fraga Dominguez and Storey, Help-Seeking Behavior in Victims of Elder Abuse: A Systematic Review"
      relevance: "Supports underreporting and help-seeking barriers as reasons help-seeking populations are selected rather than representative."
research_layers:
  layer_1_acoustic_layer:
    question: "What does the voice reveal before transcript semantics?"
    features:
      - pitch
      - energy
      - "speaking rate"
      - "pause pattern"
      - interruption
      - jitter
      - "turn-taking latency"
    hypothesis: "Manipulated or cognitively overloaded callers may show acoustic changes before explicit content reveals risk."
    output: "acoustic precursor and paralinguistic marker inventory"
  layer_2_interaction_dynamics:
    question: "How is the conversation organized as an interaction graph?"
    focus:
      - "caller initial state"
      - "trust transfer from scammer or suspicious actor to officer"
      - "information-gain moments"
      - "officer question patterns"
      - "shutdown or resistance patterns"
      - "successful intervention trajectory"
      - "already-paid or high-risk trajectory"
      - "who dominates the conversation"
      - "which topics fail to close"
      - "whether the caller fixates on one authority"
      - "whether alternative explanations are rejected"
    output: "temporal interaction graph and conversation repair map"
  layer_3_cognitive_state_modeling:
    question: "What is the caller's current cognitive vulnerability level?"
    states:
      - confusion
      - panic
      - dependency
      - suggestibility
      - "emotional overload"
      - "verification resistance"
    output: "manipulation aftermath state representation"
  layer_4_institutional_response:
    question: "Which officer interventions help shift cognitive state toward verification and action?"
    intervention_patterns:
      potentially_risky:
        - "too-fast denial"
        - "too-early challenge"
        - "command-like authority"
      potentially_effective:
        - "gradual reframing"
        - "emotional grounding"
        - "indirect questioning"
        - "timeline reconstruction"
        - "alternative explanation testing"
    output: "anti-fraud conversational intervention modeling"
  layer_5_ai_governance_institutional_capacity:
    question: "When AI-mediated scam volume scales, how does hotline review capacity fail?"
    variables:
      - "officer review capacity"
      - fatigue
      - "attention collapse"
      - "inconsistent judgment"
      - "triage overload"
      - "escalation bottleneck"
      - "delayed intervention"
      - "reconstructability decay"
    output: "review-scarcity and institutional-overload model"
representation_discovery_agenda:
