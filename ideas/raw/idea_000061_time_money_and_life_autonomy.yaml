pressure_test:
  setting: 忙碌週考慮自行完成一件事、購買協助或延後，但個人容量、必要支出與服務品質資料尚缺。
  expected_failure: 把花錢當作自動買回時間，忽略協調與驗收成本；或以省錢之名耗盡恢復、錯過無法重來的共同時間。
  smallest_test: 若本人願意，只用既有資料比較一件任務的自己做、縮小、協助／付費與延後，列出時間、金錢、責任及未知，不先付款或新增時段。
  decision: 資料足以支持且本人可承擔才另行決策；淨節時不足、品質不確定或安全底線未知則縮小、延後或保留現狀。
