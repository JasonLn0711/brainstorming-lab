maturity_note: 0/100 為未評分初始值；不是人生價值評分。僅記錄反思，未啟動研究或週選。
pressure_test:
  setting: 忙碌學期中，一件想與家人共同完成的小事反覆被延後。
  expected_failure: 把所有體驗標成急迫，導致睡眠受損、內疚或只顧拍攝；也可能沒有真正時效性。
  smallest_test: 本人選定一件事後，比較現在做、縮小做、延後；如實行，當天及一週後各留一句感受，不強制量表或連續打卡。
  decision: 只有具體窗口證據與可承擔成本才支持提前；負擔增加就縮小或停用此方法。單一案例不證明幸福理論。
