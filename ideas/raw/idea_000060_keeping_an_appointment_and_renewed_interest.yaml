pressure_test:
  setting: 忙碌週回顧一次受鼓舞的講座，口語提及想再參與，但容量未知且活動資訊未核對。
  expected_failure: 將正向回顧變成必須增加活動的壓力，或把群體玩笑及模糊人名寫成已驗證事件。
  smallest_test: 只在本人願意時保存一個有意義片段；若未來要參與，再核對活動資料、意願與容量，不從回顧自動排程。
  decision: 有具體片段即可支持這次主觀受吸引的描述；沒有後續證據仍不推長期效果；無容量則不承接新活動。
