pressure_test:
  setting: 台灣 coding agent 使用公開 toy repo，供應商主路由故障而觸發 fallback。
  expected_failure: 備援跨地域、模型版本改變、工具呼叫失敗或重試費用膨脹。
  smallest_test: 先核對可鎖定地區及所有備援處理商的書面證據；通過且另行啟動測試後，以同一組 5 個良性任務比較原版及修改版。
  decision: 必要地域證據缺失即不選用；以實際完成率及每成功任務成本決定繼續或停用，拒答減少本身不算成功。
