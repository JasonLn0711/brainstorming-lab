pressure_test:
  setting: 多項既有承諾並行時，因懷念過去熱情而想再加一件探索活動，但當前精力與剩餘容量未知。
  expected_failure: 把疲累誤認為不夠熱情，或用新目標與旅行數量證明自己仍有動力，擠壓恢復且增加失望。
  smallest_test: 僅在本人願意時，先檢查現有承諾與恢復，挑一件仍在乎的既有事項，比較續做、縮小、休息與暫緩；不另排新活動。
  decision: 若有可承擔且本人認同的小步才考慮續做；精力不足則休息或縮小，意義不再認同則調整目標；無資料保留未知。
