pressure_test:
  setting: 跨領域、跨校合作任務中，一人熟悉既有工具鏈，另一組三人需分工整合且同時承擔其他工作。
  expected_failure: 把協作成本與任務熟悉度誤認為固定能力差，或只追速度而遺漏品質驗證。
  smallest_test: 在可比且獲授權的任務切片，記錄輸入、先備經驗、本人方法與驗收；重做一小步並檢查品質及返工。
  decision: 若具體方法在可比切片改善成果且可說明原因，暫支持方法可學；若差距隨範圍或資源對齊消失則修正歸因；資料不可比即維持未知。
