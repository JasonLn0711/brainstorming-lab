  setting: 忙碌博士學期中，既有研究小步驟與臨時交付、人際期待及恢復需求衝突。
  expected_failure: 把自主誤認為全部自己完成，因無限接案或熬夜反而失去選擇能力。
  smallest_test: 從既有任務選一件，記錄選擇理由、可協商限制、縮小成果與停止條件；採取後才補實際結果。
  decision: 若可在既定容量產出自己認同的小成果則暫支持；方向清楚仍卡住時，轉查能力、資源與協商；犧牲恢復則縮小或停止。
