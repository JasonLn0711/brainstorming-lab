  setting: 自然聊天中，敘事很清楚而聽者覺得已完全理解，實際仍缺少一方觀點或逐句說話者資訊。
  expected_failure: 把自己的連貫理解當事件全貌，或將溫暖感直接升格為雙方關係結論。
  smallest_test: 若自然續談且雙方願意，回述一個理解並明示不確定處，讓分享者可補充、修正或不回答。
