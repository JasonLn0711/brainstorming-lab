pressure_test:
  setting: 若未來啟動雙人卡片／網站草稿，一方邊做邊補需求，另一方負責工程且雙方時間有限。
  expected_failure: 創作自由變成無限改版、工程建議被當阻止、草稿被當正式交付，或情感支持變成必須承接的義務。
  smallest_test: 雙方先同意一個使用情境、草稿形式、已知缺口、回饋方式及停止條件；只在另行啟動後做一個可逆切片。
  decision: 能完成已同意範圍並保留修正與拒絕空間則暫支持；範圍持續增加就縮小或重談；條件未定保持構想。
