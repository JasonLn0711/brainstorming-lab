pressure_test:
  setting: 後續若啟動：同一份授權語音含原始聲道與可追溯電話通道衍生版，混有短母音、靜音與重疊片段。
  expected_failure: 高頻特徵在空頻帶產生假精確數值；Jitter 對不合格片段仍回數值；embedding 主要依設備分群。
  smallest_observable_test: 先審查欄位字典與有效性條件；取得授權且另行啟動後，核對可計算／不可用／估計三類輸出與原始時間索引。
  decision: 缺少頻帶／聲道／母音條件的指標標記不可用；以有效性與參考一致性修訂字典，再決定是否擴大；不將合成測試視為真實電話效度。
